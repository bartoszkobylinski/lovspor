<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% for hreflang, href in alternates %}
<link rel="alternate" hreflang="{{ hreflang }}" href="{{ href }}">
{% endfor %}
<style>
  :root {
    --ink: #14181f; --muted: #5b6672; --line: #e4e7ec;
    --bg: #ffffff; --panel: #f7f8fa; --accent: #ba3a2e; --accent-ink: #8f2a20;
    --code-bg: #14181f; --code-ink: #e8eaed;
    --max: 760px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 22px; }
  header { padding: 30px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .lang { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .lang a { color: var(--muted); }
  .lang strong { color: var(--ink); }
  .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 20px; }
  .brand span { color: var(--accent); }
  main { padding: 22px 0 8px; }
  h1 { font-size: 40px; line-height: 1.12; letter-spacing: -0.03em; margin: 22px 0 14px; }
  h2 { font-size: 22px; letter-spacing: -0.02em; margin: 46px 0 10px; }
  .lede { font-size: 20px; color: var(--muted); margin: 0 0 8px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent-ink); font-weight: 600; }
  ul { padding-left: 20px; margin: 0 0 14px; }
  li { margin: 6px 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 18px 0; }
  .cover { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0; }
  .cover div { flex: 1 1 300px; }
  .yes::before { content: "✓ "; color: var(--accent); font-weight: 700; }
  .no::before  { content: "— "; color: var(--muted); }
  pre {
    background: var(--code-bg); color: var(--code-ink); border-radius: 12px;
    padding: 16px 18px; overflow-x: auto; font-size: 14px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 12px 0;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }
  a { color: var(--accent-ink); }
  .cta {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; padding: 13px 22px; border-radius: 10px; margin: 6px 0;
  }
  .cta:hover { background: var(--accent-ink); }
  .tag { display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color: var(--accent-ink); background: #f6e3e0; border-radius: 999px; padding: 3px 10px; }
  footer { border-top: 1px solid var(--line); margin-top: 54px; padding: 26px 0 60px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { h1 { font-size: 32px; } .lede { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
{% include "_chrome_header.html" %}

<main>
{% block main %}{% endblock %}
</main>

{% include "_chrome_footer.html" %}
</div>
</body>
</html>

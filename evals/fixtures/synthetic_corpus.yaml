      ## Kapittel 2. Grunnleggende bokføringsprinsipper

      ### § 5. Spesifikasjoner

      Bokførte opplysninger skal kunne spesifiseres etter pliktig regnskapsrapportering.

      ### § 7. Dokumentasjon av bokførte opplysninger

      Bokførte opplysninger skal være dokumentert på en måte som viser grunnlaget for registreringen.


      ## Kapittel 3. Avgiftspliktig omsetning

      ### § 3-1. Varer og tjenester

      Det skal beregnes merverdiavgift ved omsetning av varer og tjenester.

      ## Kapittel 6. Fritak

      ### § 6-1. Eksport

      Omsetning av varer og tjenester til utlandet er fritatt for merverdiavgift når vilkårene for eksport er oppfylt.

      ## Kapittel 15. Oppgaver og dokumentasjon

      ### § 15-10. Dokumentasjon

      Dokumentasjon av merverdiavgift skal oppbevares etter bokføringsreglene.

    body: |
      ## Kapittel 1. Innledende bestemmelser

      ### § 4. Virkeområde

      Loven gjelder rapporteringspliktige som tilbyr finansielle tjenester, betalingsformidling og tjenester knyttet til virtuell valuta.

      ## Kapittel 3. Kundetiltak

      ### § 12. Kundetiltak

      Rapporteringspliktige skal gjennomføre kundetiltak ved etablering av kundeforhold og ved mistanke om hvitvasking.

      ## Kapittel 5. Undersøkelse og rapportering

      ### § 25. Undersøkelsesplikt

      Rapporteringspliktige skal foreta nærmere undersøkelser når det avdekkes forhold som kan indikere hvitvasking.

      ### § 26. Rapporteringsplikt

      Dersom undersøkelser ikke avkrefter mistanke, skal opplysninger oversendes Økokrim.

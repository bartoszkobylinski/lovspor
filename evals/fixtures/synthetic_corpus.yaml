    body: |
      ## Kapittel 9. Opphør av leieavtaler

      ### § 9-5. Utleierens oppsigelse av tidsubestemt leieavtale

      Oppsigelse fra utleier skal være skriftlig og begrunnet. Oppsigelsen skal opplyse om at leieren kan protestere skriftlig innen én måned.

      ### § 9-7. Fravikelse

      Leieren plikter å fravike husrommet når leieavtalen er opphørt og det foreligger tvangsgrunnlag.

      ### § 9-8. Leierens død

      Ved leierens død gjelder særlige regler om hvem som kan tre inn i leieavtalen.

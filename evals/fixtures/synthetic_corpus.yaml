    slug: naboloven
    title: Lov um rettshøve mellom grannar (grannelova, naboloven)
    dataset: lover
    last_changed: "2026-02-20"
    total_changes: 2
    eu_basis: []
    body: |
      ## Kapittel I. Ålmenn føresegner

      ### § 2. Urimeleg skade eller ulempe

      Ingen må ha, gjera eller setja i verk noko som urimeleg eller uturvande er til skade eller ulempe på granneeigedom.

      ### § 3. Tre, hekk og planting

      Tre, hekk og anna planting må ikkje vera til urimeleg skade eller særleg ulempe for granne.

      ### § 7. Grannevarsel

      Den som vil setja i gang tiltak som kan verta til skade eller ulempe, skal gje granne rimeleg varsel.

      ### § 10. Retting

      Tilstand eller tiltak i strid med lova kan krevjast retta så langt det er rimeleg.

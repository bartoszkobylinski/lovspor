    slug: arbeidsmiljoloven
    title: Lov om arbeidsmiljø, arbeidstid og stillingsvern mv. (arbeidsmiljøloven)
    dataset: lover
    last_changed: "2026-04-20"
    total_changes: 3
    eu_basis: []
    body: |
      ## Kapittel 14. Ansettelse mv.

      ### § 14-9. Fast og midlertidig ansettelse

      Arbeidstaker skal som hovedregel ansettes fast. Midlertidig ansettelse kan bare avtales når lovens vilkår er oppfylt.

      ## Kapittel 15. Opphør av arbeidsforhold

      ### § 15-1. Drøfting før beslutning om oppsigelse

      Før arbeidsgiver fatter beslutning om oppsigelse, skal spørsmålet så langt det er praktisk mulig drøftes med arbeidstaker.

      ### § 15-3. Oppsigelsesfrister

      Hvis ikke annet er skriftlig avtalt eller fastsatt i tariffavtale, gjelder en gjensidig oppsigelsesfrist på en måned. Oppsigelsestid regnes fra og med første dag i måneden etter at oppsigelsen fant sted.

      ### § 15-7. Vern mot usaklig oppsigelse

      Arbeidstaker kan ikke sies opp uten at det er saklig begrunnet i virksomhetens, arbeidsgiverens eller arbeidstakerens forhold.

      ### § 15-11. Virkninger av usaklig oppsigelse

      Ved tvist om oppsigelse kan arbeidstaker etter nærmere vilkår fortsette i stillingen mens saken behandles.

      ### § 15-14. Avskjed

      Arbeidsgiver kan avskjedige arbeidstaker med påbud om øyeblikkelig fratreden dersom arbeidstaker har gjort seg skyldig i grovt pliktbrudd.

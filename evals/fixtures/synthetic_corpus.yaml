    body: |
      ## Kapittel 8. Opplysningsplikt

      ### § 8-1. Skattemelding

      Den som har plikt til å gi opplysninger, skal levere skattemelding med riktige og fullstendige opplysninger.

      ## Kapittel 9. Fastsetting

      ### § 9-4. Endring av skattefastsetting

      Skattemyndighetene kan endre enhver skattefastsetting når fastsettingen er uriktig.

      ## Kapittel 14. Tilleggsskatt

      ### § 14-3. Tilleggsskatt

      Tilleggsskatt ilegges skattepliktig som gir uriktige eller ufullstendige opplysninger.

      ### § 14-5. Unnskyldelige forhold

      Tilleggsskatt fastsettes ikke når skattepliktiges forhold må anses unnskyldelig.

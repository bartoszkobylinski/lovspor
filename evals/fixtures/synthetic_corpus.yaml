    body: |
      ## Kapittel 5. Alminnelig inntekt

      ### § 5-1. Hovedregel om skattepliktig inntekt

      Som skattepliktig inntekt anses enhver fordel vunnet ved arbeid, kapital eller virksomhet.

      ### § 5-12. Fordel vunnet ved arbeid

      Fordel vunnet ved arbeid omfatter lønn, naturalytelser og annen godtgjørelse fra arbeidsgiver.

      ## Kapittel 6. Fradrag

      ### § 6-1. Hovedregel om fradrag

      Det gis fradrag for kostnad som er pådratt for å erverve, vedlikeholde eller sikre skattepliktig inntekt.

      ## Kapittel 10. Selskaper

      ### § 10-11. Skatteplikt for utbytte

      Utbytte til personlig aksjonær regnes som skattepliktig inntekt etter reglene i denne paragrafen.

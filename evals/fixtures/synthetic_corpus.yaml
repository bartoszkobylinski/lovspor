      ## Kapittel 20. Søknadsplikt

      ### § 20-1. Tiltak som omfattes av byggesaksbestemmelsene

      Oppføring, tilbygg, påbygg, vesentlig endring og bruksendring av tiltak krever søknad og tillatelse.

      ## Kapittel 29. Krav til tiltaket

      ### § 29-4. Byggverkets plassering, høyde og avstand fra nabogrense

      Byggverkets plassering skal godkjennes av kommunen. Hvis ikke annet er bestemt, skal byggverk ha avstand fra nabogrense minst fire meter.

    body: |
      ## Kapittel 3. Om ugyldige viljeserklæringer

      ### § 30. Tvang

      En viljeserklæring er ikke bindende når den er fremkalt ved rettsstridig tvang.

      ### § 31. Svik

      Er en viljeserklæring fremkalt ved svik, er den ikke bindende for den som ble ført bak lyset.

      ### § 36. Urimelige avtaler

      En avtale kan helt eller delvis settes til side eller endres for så vidt det ville virke urimelig eller være i strid med god forretningsskikk å gjøre den gjeldende.

    last_changed: "2026-02-18"
    total_changes: 2
    eu_basis: []
    body: |
      ## Kapittel IV. Varens egenskaper

      ### § 17. Tingens egenskaper

      Tingen skal være i samsvar med de krav til art, mengde, kvalitet og andre egenskaper som følger av avtalen.

      ## Kapittel VI. Kjøperens krav

      ### § 30. Kjøperens krav ved kontraktbrudd

      Dersom det foreligger mangel eller forsinkelse, kan kjøperen kreve retting, omlevering, prisavslag, heving og erstatning.

      ### § 32. Reklamasjon

      Kjøperen taper sin rett til å gjøre en mangel gjeldende dersom kjøperen ikke innen rimelig tid etter at han oppdaget eller burde ha oppdaget mangelen, gir selgeren melding.

      ### § 40. Heving

      Kjøperen kan heve kjøpet når kontraktbruddet er vesentlig.

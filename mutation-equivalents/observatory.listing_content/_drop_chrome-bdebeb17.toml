[[equivalent]]
file = "src/lovspor/observatory/listing_content.py"
symbol = "_drop_chrome"
registered = "2026-10-03, PR #515, from run 37108571033"
mutation = """
-        and (element.tag in tags or (element.get("role") or "").strip().lower() in roles)
+        and (element.tag in tags or (element.get("role") or "XXXX").strip().lower() in roles)
"""
justification = """
The default is used only when the element has no (or an empty) role attribute;
it then becomes "" in the original and "xxxx" in the mutant after strip/lower.
`roles` is one of two fixed frozensets built from _CHROME_ROLES and
_LANDMARK_ROLES — {banner, contentinfo, search, navigation, complementary} —
which contain neither "" nor "xxxx", so membership is False in both versions.
A present role takes the attribute's own value and never the default. Python's
own `or`/frozenset semantics.
"""

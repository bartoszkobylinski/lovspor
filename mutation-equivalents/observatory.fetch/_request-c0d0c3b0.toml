[[equivalent]]
file = "src/lovspor/observatory/fetch.py"
symbol = "_request"
registered = "2026-08-18, PR #128, from run 32138706244"
mutation = """
-            "GET", attempt.url, headers=headers, timeout=self._settings.timeout_seconds
+            "get", attempt.url, headers=headers, timeout=self._settings.timeout_seconds
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_httpx_still_normalises_the_request_method"
justification = """
httpx normalises the method before the request exists: Request.__init__ does
`self.method = method.upper()`. So "get" and "GET" build the same request and put
the same bytes on the wire, and a test asserting request.method only ever sees
the normalised value. Verified against the pinned httpx: Request("get", url).method
== Request("GET", url).method == "GET".
"""

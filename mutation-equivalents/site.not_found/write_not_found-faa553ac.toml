justification = """
Codec names are case-insensitive: `str.encode` resolves the name through the
codec registry, which normalises it, so "utf-8" and "UTF-8" select the same
codec and write identical bytes. Python's codec registry, not a dependency.
Same argument as the registered `site/build._write_tree` entry.
"""

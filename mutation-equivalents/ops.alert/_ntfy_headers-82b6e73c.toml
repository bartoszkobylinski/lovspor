mutation = """
-        "Title": title(alert).encode("ascii", "replace").decode("ascii"),
+        "Title": title(alert).encode("ascii", "replace").decode("ASCII"),
"""
justification = """
Same codec-name normalisation as the encode("ASCII") entry: the decoder for
"ASCII" is the one for "ascii". Its input is the output of an ascii encode
with "replace", so it holds only bytes below 0x80 and both spellings decode
it to the same str without error.
"""

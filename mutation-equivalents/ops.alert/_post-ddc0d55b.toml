justification = """
Codec names are normalised before lookup, so `str.encode("UTF-8")` and
`str.encode("utf-8")` select the same encoder and produce identical bytes for
every string (and a Python str can always be encoded to UTF-8 except for lone
surrogates, which both spellings refuse identically). The posted body is the
same on every input.
"""

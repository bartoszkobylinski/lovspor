justification = """
Codec names are looked up case-insensitively and normalised before a codec is
selected: codecs.lookup("UTF-8").name and codecs.lookup("utf-8").name are both
"utf-8", so the two spellings reach the same encoder and produce the same
bytes. Verified directly on the string this function hashes, including the
non-ASCII case: sha256(s.encode("utf-8")).hexdigest() ==
sha256(s.encode("UTF-8")).hexdigest(). No test can distinguish them, because
there is no input for which they differ.
"""

[[equivalent]]
file = "src/lovspor/observatory/survey_probe.py"
symbol = "_robots"
registered = "2026-09-23, PR #368, from run 35843560071"
mutation = """
-            declared_sitemaps=gate.sitemaps(base, self._settings.user_agent),
+            declared_sitemaps=gate.sitemaps(base, None),
"""
justification = """
`RobotsGate` fetches robots.txt once per host and caches the parsed policy by
URL; the user agent is used only by that first fetch. In `_robots` the call
before this one, `gate.readable(base, user_agent)`, has already performed the
fetch, so the argument to `sitemaps()` never reaches a request: the cached
policy is returned whatever is passed. The value is passed for the contract
(every reader names the crawler), not because this call can observe it.
"""

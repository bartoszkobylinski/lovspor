[[equivalent]]
file = "src/lovspor/observatory/survey_probe.py"
symbol = "_body"
registered = "2026-09-22, PR #353, from run 35688797552"
mutation = """
-                headers={"User-Agent": self._settings.user_agent},
+                headers={"user-agent": self._settings.user_agent},
"""
justification = """
HTTP field names are case-insensitive (RFC 9110 §5.1), and httpx's `Headers`
resolves any spelling to the same value, so the server, the transport and every
assertion a test can make on the recorded request see one User-Agent whatever
the case of its name. Only the raw bytes differ, and no conforming peer may
read a meaning into them. Argued from the protocol and the dependency, hence
pinned.
"""
assumption_test = "tests/unit/test_observatory_survey_probe.py::TestWhatTheEquivalentsRegisterAssumes::test_httpx_header_names_are_case_insensitive"

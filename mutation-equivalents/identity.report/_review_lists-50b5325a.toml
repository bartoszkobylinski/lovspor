mutation = '''
-        "registry_conflicts": [c.model_dump(mode="json") for c in plan.registry_conflicts],
+        "registry_conflicts": [c.model_dump(mode="JSON") for c in plan.registry_conflicts],
'''
justification = """
pydantic (2.13) treats every `mode` of `model_dump` other than "json" as
"python": "JSON", "XXjsonXX" and None all give the python-mode dump. The two
modes differ only for values JSON has no type for (tuple, set, date, Path,
enum, bytes, ...). Every field of the dumped models (SlugFate, HolderFate,
Rename, CollisionAudit, HistoryMismatch, RegistryConflict, RestoredTombstone,
Threshold) is a str, int, bool, None, list or one of those models. Both modes
therefore return equal dicts, and report.json and report.md come out byte for
byte the same. The assumption test pins pydantic's mode handling and the
field types.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_pydantic_dumps_any_mode_but_json_as_python"

[[equivalent]]
file = "src/lovspor/legaltime/instructions.py"
symbol = "__init__"
registered = "2026-11-10, PR #865, from the mutation artifact at commit 1f8be75f"
mutation = """
-        self.bound_host: str | None = None  # the article whose intro bound ``act``
+        self.bound_host: str | None = ""  # the article whose intro bound ``act``
"""
justification = """
``bound_host`` is read only in ``_Reader._boundary``, as ``moved =
node.host_section != self.bound_host``. ``moved`` resets the block (``substitution``,
``pending_item_act`` and ``act`` to None, ``bound_host`` to the node's host,
``unbound`` to ``unbound or binding.opens``) and clears ``in_list``. ``bound_host``
carries across parts, so only the document's first node can see the initial
value. With None that node either matches (host None) or resets; with "" it
always resets. At the first node ``substitution``, ``pending_item_act`` and
``act`` are already None (``__init__``, ``_read_part``), ``in_list`` is already
False (``_read_part``), the reset writes the host the matching path leaves equal
to it, and ``unbound`` ends as ``unbound or binding.opens`` on both paths: the
non-reset path is taken only when both are False and ``self.unbound`` is still
its initial False. Every later read sees the same state, so the output is
identical. (Re-argued for PR #873, where ``_boundary`` gained ``binding.opens``
and ``in_list``.)
"""

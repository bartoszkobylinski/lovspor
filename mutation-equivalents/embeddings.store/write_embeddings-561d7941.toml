[[equivalent]]
file = "src/lovspor/embeddings/store.py"
symbol = "write_embeddings"
registered = "2026-09-23, PR #376, from run 35854180642"
mutation = """
-        encoded = section_id.encode("utf-8")
+        encoded = section_id.encode("UTF-8")
"""
justification = """
Codec names are case-insensitive: `encodings.normalize_encoding` lowercases the
name before lookup, so "UTF-8" and "utf-8" resolve to the same codec object and
`str.encode` produces the same bytes for every input. No test can distinguish
them. Same argument as the `_normalise_token` entry for robots.py.
"""

[[equivalent]]
file = "src/lovspor/release/reconcile.py"
symbol = "_resolve_staged"
registered = "2026-09-10, PR #269, from the mutation artifact at commit 929b788"
mutation = """
-        active = complete_first_migration(plane, host, answered).active
+        active = complete_first_migration(plane, host, None).active
"""
justification = """
`complete_first_migration` reads its third argument exactly once, as `if
answered == host.socket_admin`, so its behaviour depends on that argument only
through that one equality — any two values unequal to `host.socket_admin` are
interchangeable there.

At this call site `answered` is always unequal to it. `_resolve_staged` has one
caller, `_resolve_window` (line 183), which has one caller,
`_reconcile_unmarked` (line 201); `_reconcile_unmarked` reaches
`_resolve_window` only after `if answered == host.socket_admin and
situation(triple) != Situation.reloaded: return _resolve(...)`, with nothing
running between the guard and the call. `_resolve_window` re-evaluates
`situation` on that same, unmutated triple and reaches `_resolve_staged` only
when the row is `Situation.staged`, which is not `Situation.reloaded`. So the
guard's second conjunct was true, hence its first was false: `answered !=
host.socket_admin`. And `None != host.socket_admin` always, because
`MigrationHost.__post_init__` runs `socket_path(self.socket_admin)`, which
requires a `unix/`-prefixed string. Both values take the same branch on every
reachable input.
"""

[[equivalent]]
file = "src/lovspor/embeddings/cache_store.py"
symbol = "_publish"
registered = "2026-11-07, PR #825, from run 42299738173"
mutation = """
-        os.link(staged, final, follow_symlinks=False)
+        os.link(staged, final, follow_symlinks=None)
"""
justification = """
`os.link` converts `follow_symlinks` with the argument-clinic `bool`
converter (truth value), so `None` is falsy and selects exactly the
`follow_symlinks=False` path: linkat without AT_SYMLINK_FOLLOW, which links a
symlink itself rather than its target. Both spellings publish the same name to
the same inode. The non-equivalent mutants (`True`, omitted) are killed by
test_temporary_swapped_for_a_symlink_is_never_published_as_its_target.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_os_link_follow_symlinks_none_does_not_follow"

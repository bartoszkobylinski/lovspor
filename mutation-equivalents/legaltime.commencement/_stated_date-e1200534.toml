[[equivalent]]
file = "src/lovspor/legaltime/commencement.py"
symbol = "_stated_date"
registered = "2026-11-07, PR #833 (artifact at 0bb7c4d4); lines updated for the phase-2 citation pattern (#744)"
mutation = """
-    return parse_date(_CITED.sub("", sentence[phrase.end() :]))
+    return parse_date(_CITED.sub("XXXX", sentence[phrase.end() :]))
"""
justification = """
`_CITED.sub(...)` removes every cited act or regulation ("lov 14. juni 2019 nr. 99")
from the text after the commencement phrase before `parse_date` looks for the
stated date. The replacement string only has to contain no date. "XXXX" has no
digit, so `DATE` (a one- or two-digit day, a dot, a month name and a four-digit
year) cannot match inside it, and `parse_date` finds exactly the same first
date outside a citation as with "". Same argument as the registered
`_informational` entry on the same pattern.
"""

[[equivalent]]
file = "src/lovspor/legaltime/commencement.py"
symbol = "_proof"
registered = "2026-11-07, PR #833, from the mutation artifact at commit 40b894a"
mutation = """
-        quote_sha256=sha256(quote.encode("utf-8")).hexdigest(),
+        quote_sha256=sha256(quote.encode("UTF-8")).hexdigest(),
"""
justification = """
The mutated name is passed to a codec lookup and nowhere else. Python's
codec registry normalises an encoding name before lookup: case is folded and
hyphens and underscores are interchangeable (`encodings.normalize_encoding`),
so `codecs.lookup("UTF-8")` and `codecs.lookup("utf-8")` return the same
CodecInfo and the same bytes are read or written for every input. Documented
language behaviour of `codecs.lookup`, not a dependency's; the same argument
is already registered for atomic_io.atomic_write_text.
"""

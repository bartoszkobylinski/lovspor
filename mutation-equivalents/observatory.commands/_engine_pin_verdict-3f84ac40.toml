[[equivalent]]
file = "src/lovspor/observatory/commands.py"
symbol = "_engine_pin_verdict"
registered = "2026-09-23, PR #373, from run 35848943844"
mutation = """
-    if os.environ.get(ENV_REQUIRE_PINNED_ENGINE, "").strip() != "1":
+    if os.environ.get(ENV_REQUIRE_PINNED_ENGINE, "XXXX").strip() != "1":
"""
justification = """
`dict.get`'s second argument is returned only when the key is absent, and the
branch asks whether the value strips to "1". Neither "" nor "XXXX" does, so an
absent variable takes the same early return under both defaults, and a present
variable never sees the default at all. Python semantics only.
"""

mutation = """
-    text = payload.decode("utf-8", errors="ignore")
+    text = payload.decode(errors="ignore")
"""
justification = """
`bytes.decode` defaults to UTF-8, so dropping the explicit name selects the
same codec, and codec lookup is case-insensitive, so "UTF-8" selects it too.
Neither can differ from the original on any input.
"""

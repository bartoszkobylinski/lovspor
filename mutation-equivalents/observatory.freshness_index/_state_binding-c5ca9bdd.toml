assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_a_python_mode_dump_serialises_like_json_mode"
justification = """
pydantic selects the JSON serialiser only for the exact string "json"; None
takes the Python path. `StoredRun` holds exactly two fields, `sha256: str` and
`unchanged: int`, both JSON-native, so the Python path returns the same dict of
the same str and int values and the canonical `json.dumps` bytes, hence the
binding digest, are identical. Hand-applied on PR #428: the freshness and
freshness-index suites pass unchanged. The assumption test re-checks every mode
spelling for StoredRun (including an int beyond 64 bits), so a field type the
Python path renders differently turns this waiver into a red test.
"""

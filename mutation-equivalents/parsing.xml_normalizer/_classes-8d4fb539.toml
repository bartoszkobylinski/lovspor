mutation = """
-    return str(element.get("class") or "").split()
+    return str(element.get("class") or "XXXX").split()
"""
justification = """
`_classes` has exactly two callers, both in `_drop_identity_rows`, and both
only test membership of a fixed constant: `_KEY_INFO_CLASS`
("data-document-key-info") and `_IDENTITY_ROW_CLASS` ("eli"). For an element
without a class attribute the original returns `[]` and the mutant `["XXXX"]`;
neither list contains either constant, so every membership test, and so every
removal decision and every hash, is identical. Python `str`/`list` semantics,
no dependency.
"""

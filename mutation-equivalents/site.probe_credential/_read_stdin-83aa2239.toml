[[equivalent]]
file = "src/lovspor/site/probe_credential.py"
symbol = "_read_stdin"
registered = "2026-09-30, PR #469, from run 36669099930"
mutation = """
-    return data.decode("utf-8") if isinstance(data, bytes) else data
+    return data.decode("UTF-8") if isinstance(data, bytes) else data
"""
justification = """
Codec names are case-insensitive: `bytes.decode` resolves the name through
the codec registry, which normalises it (`codecs.lookup("UTF-8")` and
`codecs.lookup("utf-8")` return the same CodecInfo), so both spellings select
the same decoder and produce the same text on every input, and raise the same
UnicodeDecodeError on malformed input. Python's codec registry, not a
dependency. (Skipping the byte layer, which WOULD change the codec, is killed
by `test_stdin_is_read_as_utf_8_whatever_its_text_encoding`.)
"""

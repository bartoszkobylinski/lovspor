[[equivalent]]
file = "src/lovspor/site/probe_credential.py"
symbol = "_read_secret"
registered = "2026-09-30, PR #469, from run 36669099930"
mutation = """
-    return path.read_text(encoding="utf-8")
+    return path.read_text(encoding="UTF-8")
"""
justification = """
Codec names are case-insensitive: `Path.read_text` hands the name to the
text wrapper, which resolves it through the codec registry, and the registry
normalises the name (`codecs.lookup("UTF-8")` and `codecs.lookup("utf-8")`
return the same CodecInfo), so both spellings decode the same bytes to the
same credential. Python's codec registry, not a dependency. (`encoding=None`
is NOT equivalent — it is the locale's codec — and is killed under the C
locale by `test_the_credential_is_read_as_utf_8_whatever_the_process_locale`.)

This supersedes the entry registered for `load_probe_token` in PR #268, which
argued the identical point about the same read. PR #469 moved the path read
into `_read_secret` beside the stdin read (issue #467), and that entry no
longer matched any code. An entry that can never match is the drift this
register warns about, so it is replaced rather than left as decoration.
"""

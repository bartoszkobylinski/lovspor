file = "src/lovspor/release/caddy.py"
symbol = "canonical_hash"
registered = "2026-09-09, PR #268, from run 34397173401"
mutation = """
-    canonical = json.dumps(subtree, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
+    canonical = json.dumps(subtree, sort_keys=True, separators=(",", ":"), ensure_ascii=None)
"""
justification = """
`json.dumps` reads `ensure_ascii` only for its truth value, and `None` is
falsy exactly as `False` is, so both select the encoder that keeps non-ASCII
as is and produce byte-identical canonical text, hence the same SHA-256. Same
argument as the registered `observatory/model.record_to_json_line` entry;
Python's own `None` semantics. (`ensure_ascii` removed or `True` is NOT
equivalent and is killed by the "æøå" value in
`test_the_hash_is_the_sha256_of_the_compact_sorted_utf_8_serialisation`.)
"""

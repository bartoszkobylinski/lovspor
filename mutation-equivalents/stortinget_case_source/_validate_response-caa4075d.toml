[[equivalent]]
file = "src/lovspor/stortinget_case_source.py"
symbol = "_validate_response"
registered = "2026-10-15, PR #614, from the mutation artifact of run 38780023516 (e6ac4a7), each re-checked by hand on the rewritten line"
mutation = """
-    header: str = response.headers.get("content-type", "")
+    header: str = response.headers.get("CONTENT-TYPE", "")
"""
justification = """
`response.headers` is an httpx `Headers`, whose lookups lower-case the
requested name before matching (HTTP field names are case-insensitive,
RFC 9110 section 5.1), so get("CONTENT-TYPE") and get("content-type") return
the same value, or the same default, for every response a server can send.
Argued from the dependency, hence pinned.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_httpx_header_lookup_is_case_insensitive"

registered = "2026-09-09, PR #262, from run 34315002166"
mutation = """
-        schema_sha256=hashlib.sha256(canonical.encode("utf-8")).hexdigest(),
+        schema_sha256=hashlib.sha256(canonical.encode("UTF-8")).hexdigest(),
"""
justification = """
Codec names are case-insensitive in Python: `str.encode` resolves the name
through the codec registry, which normalises it (lower-cases, folds spaces and
hyphens) before lookup, so "utf-8", "UTF-8" and "utf8" all resolve to the same
UTF-8 codec and encode identical bytes. The digest of identical bytes is
identical. This is a property of the language's codec registry, not of any
dependency.
"""

[[equivalent]]
file = "src/lovspor/stortinget_discovery.py"
symbol = "_checked_listing"
registered = "2026-11-02, PR #768, owner-approved; survived run 41474301331 at commit 2134acf7"
mutation = """
-    header: str = response.headers.get("content-type", "")
+    header: str = response.headers.get("CONTENT-TYPE", "")
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_httpx_header_lookup_is_case_insensitive"
justification = """
An httpx `Headers` lookup lower-cases the requested name, so
`get("CONTENT-TYPE", "")` and `get("content-type", "")` return the one stored
value, or the same default when the header is absent. HTTP field names are
case-insensitive (RFC 9110 §5.1). The same mutant is registered for
site/probe.py. Argued from the dependency, hence pinned.
"""

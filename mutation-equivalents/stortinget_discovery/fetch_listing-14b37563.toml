[[equivalent]]
file = "src/lovspor/stortinget_discovery.py"
symbol = "fetch_listing"
registered = "2026-11-02, PR #768, owner-approved; survived run 41474301331 at commit 2134acf7"
mutation = """
-        with client.stream("GET", endpoint, params=params, follow_redirects=False) as response:
+        with client.stream("GET", endpoint, params=params, follow_redirects=None) as response:
"""
assumption_test = "tests/unit/test_observatory_robots_live.py::TestWhatTheEquivalentsRegisterAssumes::test_httpx_reads_follow_redirects_none_as_do_not_follow"
justification = """
httpx 0.28 `Client.send` substitutes the client's own setting only when the
argument is the `USE_CLIENT_DEFAULT` sentinel; `None` is not that sentinel, so
it is passed through and then tested with a bare `if follow_redirects:`. `None`
and `False` are both falsy, so a redirect comes back unfollowed in both cases,
even on a client built with `follow_redirects=True` (checked on httpx 0.28.1:
both return the 302 unfollowed). The same mutant is registered for
observatory/robots_live.py. Argued from the dependency, hence pinned.
"""

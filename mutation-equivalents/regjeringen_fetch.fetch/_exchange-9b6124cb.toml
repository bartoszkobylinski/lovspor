[[equivalent]]
file = "src/lovspor/regjeringen_fetch/fetch.py"
symbol = "_exchange"
registered = "2026-11-09, PR #852, predicted from the _answer pair in run 42661488989 (same expression, new call site)"
mutation = """
-        return _Reply(status, response.headers.get("Location"), body)
+        return _Reply(status, response.headers.get("location"), body)
"""
justification = """
`response.headers` is an httpx `Headers`, whose lookup lower-cases the requested
name, so "Location", "location" and "LOCATION" read the one stored value on
every response, whatever spelling the server sent. The robots.txt hop records
the same `location` under all three, and the same-host check reads that value.
Argued from the dependency, hence pinned; the same pair exists for `_answer`.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_httpx_header_lookup_is_case_insensitive"

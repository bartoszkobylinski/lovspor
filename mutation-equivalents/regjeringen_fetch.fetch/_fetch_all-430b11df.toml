[[equivalent]]
file = "src/lovspor/regjeringen_fetch/fetch.py"
symbol = "_fetch_all"
registered = "2026-11-09, PR #852, from run 42661488989 (mutation artifact at commit 06481dad)"
mutation = """
-    stopped = False
+    stopped = None
"""
justification = """
`stopped` is read only as `if stopped:` and is only ever reassigned a bool
(`records[-1].outcome is FetchOutcome.STOPPED_BY_SERVER`). None and False are
both falsy, so every branch taken, and every record appended, is identical.
Argued from Python's own semantics; no dependency, no assumption test.
"""

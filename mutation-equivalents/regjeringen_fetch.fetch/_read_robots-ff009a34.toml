[[equivalent]]
file = "src/lovspor/regjeringen_fetch/fetch.py"
symbol = "_read_robots"
registered = "2026-11-09, PR #852, from run 42661488989 (mutation artifact at commit 06481dad)"
mutation = """
-    session.limiter.wait(HOST, session.delay)
+    session.limiter.wait(HOST, None)
"""
justification = """
`_read_robots` is private and called once, from `run_fetch`, on the line after
`run_fetch` builds a fresh `RateLimiter` for the run. So this is always the
limiter's first `wait` for HOST, and `RateLimiter.wait` reads
`minimum_interval` only when it has a previous timestamp for the host: on a
first call it sleeps nothing, returns 0.0 and records the time whatever the
interval is. The interval argument is never read here (and `session.delay` is
still its 0.0 default at this point). The recorded timestamp, which is what
spaces the first page request, is the same under both. Pinned by an
assumption test on RateLimiter's first-call behaviour.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_rate_limiter_ignores_the_interval_on_a_hosts_first_wait"

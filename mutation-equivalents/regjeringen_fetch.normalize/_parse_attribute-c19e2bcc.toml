justification = """
This return builds an attribute without a value (`value is None`). The only
reader of `_Attribute.value_start` is `_strict_value`, which returns `None`
when `value is None` before it reads `value_start`; no other code reads the
field, and attributes are never compared or hashed. So `name_end` and `None`

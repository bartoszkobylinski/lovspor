mutation = """
-            return None, max(after_space, opening + 1)
+            return None, max(after_space, opening - 1)
"""
justification = """
`_parse_tag` only gets here after `raw[opening + 1]` was checked to be a
letter, and letters are in `_TAG_NAME`, so `end = _skip(raw, opening + 1,
_TAG_NAME) >= opening + 2` and `after_space = _skip(raw, end, ...) >= end`.
Hence `max(after_space, opening - 1) == after_space == max(after_space,
opening + 1)` for every input.
"""

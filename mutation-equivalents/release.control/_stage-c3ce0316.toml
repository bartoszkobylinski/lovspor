[[equivalent]]
file = "src/lovspor/release/control.py"
symbol = "_stage"
registered = "2026-09-09, PR #268, from run 34397173401"
mutation = """
-        atomic_write_text(plane.previous_fragment, plane.fragment.read_text(encoding="utf-8"))
+        atomic_write_text(plane.previous_fragment, plane.fragment.read_text(encoding="UTF-8"))
"""
justification = """
Codec names are case-insensitive: `Path.read_text` resolves the name through
the codec registry, which normalises it, so both spellings decode the foreign
fragment's bytes to the same text and the same kept copy is written. Python's
codec registry, not a dependency. (`encoding=None` is NOT equivalent — it is
the locale's codec — and is killed under the C locale by
`test_the_kept_copy_is_read_as_utf_8_whatever_the_process_locale`.)
"""

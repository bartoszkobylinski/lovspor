[[equivalent]]
file = "src/lovspor/atomic_io.py"
symbol = "atomic_write_text"
registered = "2026-09-10, PR #269, from the mutation artifact at commit 929b788"
mutation = """
-    path: Path, text: str, *, encoding: str = "utf-8", mode: int | None = None
+    path: Path, text: str, *, encoding: str = "UTF-8", mode: int | None = None
"""
justification = """
The parameter is used in exactly one place, `text.encode(encoding)` (it was
`tmp.write_text(text, encoding=encoding)` when this entry was registered; PR
for #280 moved the encode ahead of the staging file), so the default's only
effect is which codec that call selects. Python's codec registry normalises an encoding name before lookup —
case is folded and hyphens and underscores are interchangeable
(`encodings.normalize_encoding`), so `codecs.lookup("UTF-8")` and
`codecs.lookup("utf-8")` return the same CodecInfo. Both spellings therefore
reach the same encoder and write identical bytes for every input. The same
registry argument already registered for `decode("UTF-8")` in
observatory/manifest and for `encode("UTF-8")` in release/caddy; it is
documented language behaviour of `codecs.lookup`, not a dependency's.
"""

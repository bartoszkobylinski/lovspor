[[equivalent]]
file = "src/lovspor/legaltime/nesting.py"
symbol = "_outside_nodes"
registered = "2026-11-12, PR #894, from a local scoped mutmut 3.8.0 run at commit 4793b0d9"
mutation = """
-        if not any(p == index and position > start for p, start in regions)
+        if not any(p == index and position >= start for p, start in regions)
"""
justification = """
`>=` additionally removes node `start` (the host's own "§ N skal lyde:"
instruction) from the outside count. That node opens a payload and is never a
captured clause, so no clause count changes.
"""

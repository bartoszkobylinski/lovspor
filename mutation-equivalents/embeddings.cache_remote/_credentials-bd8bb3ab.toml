[[equivalent]]
file = "src/lovspor/embeddings/cache_remote.py"
symbol = "_credentials"
registered = "2026-11-08, PR #844, from run 42496403404"
mutation = """
-    values = {name: os.environ.get(name, "") for name in _CREDENTIAL_VARIABLES}
+    values = {name: os.environ.get(name, None) for name in _CREDENTIAL_VARIABLES}
"""
justification = """
os.environ.get(name, default) returns the variable's string when it is set and
`default` otherwise; with no default, or default None, an unset variable gives
None instead of "". The value's only uses here are its truthiness (`if not
backend`, `if not value`) and, when truthy, the value itself. None and "" are
both falsy, so an unset variable takes the same branch either way (local store
returned / variable named as missing), and a set variable is the same string.
Python's own semantics; no dependency involved.
"""

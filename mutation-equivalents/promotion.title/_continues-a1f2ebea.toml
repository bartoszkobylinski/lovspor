justification = """
str.rsplit(maxsplit=k)[-1] is the last whitespace-separated word for every k >= 1: splitting more times from the right only adds earlier items, never changes the last, on every input (an empty line raises IndexError identically under both).
The plain split()/rsplit() form that would leave no such mutant is refused by
ruff PLC0207. Python stdlib semantics.
"""

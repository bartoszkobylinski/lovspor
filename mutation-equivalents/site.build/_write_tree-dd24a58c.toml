[[equivalent]]
file = "src/lovspor/site/build.py"
symbol = "_write_tree"
registered = "2026-09-09, PR #263, from run 34336249675"
mutation = """
-        target = out / path.lstrip("/") / "index.html"
+        target = out / path.lstrip("XX/XX") / "index.html"
"""
assumption_test = "tests/unit/test_site_routes.py::TestSiteRoute::test_rejects_a_path_outside_the_directory_shape"
justification = """
The argument to `str.lstrip` is a CHARACTER SET, so "XX/XX" is the set {X, /}.
The keys of `pages` are emitted page paths: a `SiteRoute.path`, which the
`RoutePath` pattern `^/(?:[a-z0-9-]+/)*$` restricts to "/" and lower-case ASCII
segments, or that path behind the "/en" prefix. No such string can carry an
upper-case X anywhere, let alone at its front, so the X in the set never
matches and the set strips exactly what {/} strips. Same argument as the
registered `observatory/registry.normalised_domain` entry. The path shape is a
pydantic constraint, so the route-shape test that rejects "/Status/" is named
as the assumption test.
"""

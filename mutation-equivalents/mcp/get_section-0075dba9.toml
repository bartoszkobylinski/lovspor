+    body = self._body_for_slug(record.slug or "XXXX") or ""
"""
justification = """
`record` comes from `_resolve_slug`, which returns only entries of the state's
slug index or of its lineage mapping — both built by `CorpusSnapshot.slug_index`,
which skips every manifest record whose slug is None. `record.slug` is therefore
always a non-empty string and the `or` fallback is never evaluated.

-    typer.echo(prepared.markdown, nl=False)
+    typer.echo(prepared.markdown, nl=None)
"""
justification = """
`click.echo` reads nl only as `if nl:`, so None and False both write the message
with no trailing newline. The nl=True and dropped-argument mutants, which do add
one, are killed by test_preview_prints_the_header_then_exactly_the_markdown_local_writes.
Dependency behaviour (click), pinned by the assumption test.
"""
assumption_test = "tests/unit/test_mutation_equivalents_assumptions.py::test_assumption_click_echo_treats_none_as_empty_and_reads_nl_for_truth"

[[equivalent]]
file = "src/lovspor/release/envelope.py"
symbol = "read_fragment"
registered = "2026-09-09, PR #268, from run 34397173401"
mutation = """
-        return (root / FRAGMENT_NAME).read_text(encoding="utf-8")
+        return (root / FRAGMENT_NAME).read_text(encoding="UTF-8")
"""
justification = """
Codec names are case-insensitive: `Path.read_text` resolves the name through
the codec registry, which normalises it, so both spellings decode the
fragment's bytes to the same text. Python's codec registry, not a dependency.
(`encoding=None` is NOT equivalent — the fragment's header carries an em dash
— and is killed under the C locale by
`test_is_read_as_utf_8_whatever_the_process_locale`.)
"""

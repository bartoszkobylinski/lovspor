+    request.headers["AUTHORIZATION"] = (
"""
justification = """
httpx Headers fold the name's case: setting or reading "X-AMZ-DATE" and
"x-amz-date" addresses one value, iteration lists names lower-cased, and the
signer lower-cases every name it signs anyway. So the canonical request, the
signature and every header value are unchanged; at most the name's case on the
wire differs, which HTTP field names ignore (RFC 9110, section 5.1). The
assumption test pins httpx's case folding.
"""
assumption_test = "tests/unit/test_r2_client_equivalence_assumptions.py::test_assumption_httpx_header_names_fold_case_on_set_and_lookup"

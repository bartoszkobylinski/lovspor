whitespace, a comma or end-of-string. Both replacements, `""` and `XX""XX`, are
non-empty, contain no newline, no comma, no whitespace and no letter of
"bearer", so no match can begin inside, end inside or span across a replaced
span, and everything outside the replaced spans is identical in the two
strings. A match therefore exists in one exactly when it exists in the other,
and the function's boolean is the same for every challenge. Pure Python `re`
semantics, no dependency; checked by a 200,000-string fuzz over the pattern's
alphabet (quotes, commas, spaces, backslashes, "Bearer" in both cases, "X")
with zero disagreements.

mutation = """
-            check=False,
+            check=None,
"""
justification = """
`subprocess.run` reads `check` only for its truth value (`if check and
retcode:`), and `None` is falsy exactly as `False` is, so neither raises on a
non-zero exit; the caller reads `returncode` itself and refuses with its own
message. Same argument as the registered `site/build._git` entry; Python's
own `None` semantics, not a dependency.
"""

[[equivalent]]
file = "src/lovspor/observatory/selection.py"
symbol = "selection_enabled"
registered = "2026-10-02, PR #504, from run 37034306144"
mutation = """
-    return os.environ.get(ENV_CAPTURE_SELECTION, "").strip() == "1"
+    return os.environ.get(ENV_CAPTURE_SELECTION, "XXXX").strip() == "1"
"""
justification = """
The default is used only when the variable is unset, and then the result is
`default.strip() == "1"`. For the original that is `"" == "1"`, for the mutant
`"XXXX" == "1"`: both False. When the variable is set, `dict.get` returns its value
and ignores the default, so both versions compare the same string. No environment
yields a different boolean; this is `os.environ.get`/`str.strip`/`==` semantics,
not a dependency's behaviour.
"""

[[equivalent]]
file = "src/lovspor/crosswalk/approval.py"
symbol = "verify_signature"
registered = "2026-11-05, PR #799 (#792), left after two Codex remediation cycles"
mutation = '''
-    found = _ssh_keygen(["find-principals", "-s", str(signature), "-f", str(signers)], b"")
+    found = _ssh_keygen(["find-principals", "-s", str(signature), "-f", str(signers)], None)
'''
justification = """
`ssh-keygen -Y find-principals` reads the signature from `-s` and the allowed
signers from `-f`; it never reads stdin. With `input=None` the child inherits the
parent's stdin instead of an empty pipe, but a process that never reads stdin
cannot tell the two apart: the same principals come back and the same exit
status. The assumption test holds an open, never-written stdin pipe and gets the
principal anyway, which a stdin reader would block on.
"""
assumption_test = "tests/unit/test_crosswalk_approval_assumptions.py::test_assumption_find_principals_never_reads_stdin"

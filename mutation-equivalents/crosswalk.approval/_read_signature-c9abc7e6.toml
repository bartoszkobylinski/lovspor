[[equivalent]]
file = "src/lovspor/crosswalk/approval.py"
symbol = "_read_signature"
registered = "2026-11-05, PR #799 (#792), left after two Codex remediation cycles"
mutation = '''
-            data = stream.read(MAX_SIGNATURE_BYTES + 1)
+            data = stream.read(MAX_SIGNATURE_BYTES + 2)
'''
justification = """
The read only has to tell "at most MAX_SIGNATURE_BYTES" from "more". A file of
at most MAX bytes is read whole by either bound, so the same bytes are returned.
A longer file yields more than MAX bytes under either bound (`read(n)` on a
regular file returns min(n, size) bytes), so both refuse it as too large with the
same message. The returned data, and so the signature digest, never differ.
"""

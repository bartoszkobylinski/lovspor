repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks secret scan
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy strict
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest unit
        entry: uv run pytest tests/unit/ -q
        language: system
        types: [python]
        pass_filenames: false

name: Release

# Publishes lovspor to PyPI when a GitHub Release is published.
# Auth is PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# Build and publish are separate jobs: the build never sees an OIDC token,
# and the publish job runs no repo code — it only uploads the built artifacts.
# One-time PyPI setup and the per-release steps are in docs/releasing.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Assert built version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/lovspor-${tag}.tar.gz" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match the pyproject version. Built artifacts:"
            ls -1 dist/
            exit 1
          fi

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/lovspor/
    permissions:
      id-token: write # mint the OIDC token PyPI trusted publishing needs
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

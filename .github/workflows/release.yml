name: Release

# Publishes lovspor to PyPI when a GitHub Release is published.
# Auth is PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# One-time PyPI setup and the per-release steps are in docs/releasing.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lovspor/
    permissions:
      contents: read
      id-token: write # mint the OIDC token PyPI trusted publishing needs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Assert built version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/lovspor-${tag}.tar.gz" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match the pyproject version. Built artifacts:"
            ls -1 dist/
            exit 1
          fi

      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always

name: Test

on:
  push:
    branches: [main]
  # Any base, not only main (issue #572): a stacked PR's base is a feature
  # branch, and the retarget to main when that base merges fires only `edited`.
  # A main-only filter left the ruleset-required `test (3.x)` checks missing on
  # the head SHA, so the PR stayed BLOCKED until closed and reopened.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the LLHB apparatus leg: it is the only leg that verifies the
        # frozen tool-surface hash (tests/unit/test_llhb_mcp_surface.py,
        # APPARATUS_PYTHON). Do not remove it without moving the apparatus.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy strict
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: Coverage threshold
        run: uv run coverage report --fail-under=90

name: Security audit

# Shared audit from bartoszkobylinski/security-audit (milamber_assistant #205).
# A secret in the checked-out tree fails this job; secrets in history, bandit
# (high severity) and pip-audit findings are reported in the run summary only.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: bartoszkobylinski/security-audit/.github/workflows/audit.yml@b6ec8baca02688f2f336f44faa2f912d5cef3e91 # fix/report-only-steps (security-audit#2)
    with:
      # Public repo: hosted minutes are free.
      runner: '"ubuntu-latest"'

# Nightly mutation lane: the PR-scoped wrapper (scripts/mutmut-pr.sh) over the
# range of main that no completed night has measured yet. A REPORT, never a
# merge gate: mutation left the PR pipeline (docs/agentic-ci.md, "Nightly
# mutation"). No LLM runs here.
name: Nightly Mutation

on:
  # Started by launchd on the Mac mini (`gh workflow run nightly-mutation.yml`,
  # 00:30 Europe/Oslo), not by `schedule:`. GitHub started the cron run of
  # 2026-11-12 four and a half hours late (23:30 UTC cron, 04:01 UTC start),
  # and a scheduled start has no guaranteed time. See docs/agentic-ci.md.
  workflow_dispatch:

# One night at a time. Never cancelled: a cancelled run measured nothing it can
# report, and the next night would redo the same range anyway.
concurrency:
  group: nightly-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-mutation:
    # Hosted, as the PR mutation job was: lovspor is public, so hosted minutes
    # are free, and the Mac mini runner stays free for the agent lanes.
    runs-on: ubuntu-latest
    # Strictly above the largest wall-clock budget the budget step hands out
    # (cap=12600 s = 210 min) plus setup and the harvest after the cut, and
    # below the hosted runner's own 360 min kill. Pinned by
    # tests/unit/test_nightly_mutation.py.
    timeout-minutes: 345
    permissions:
      # contents: write moves the nightly-mutation-base tag; issues: write
      # rewrites the rolling report issue. Nothing else is written.
      contents: write
      issues: write
    env:
      UV_PYTHON: "3.12"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BASE_TAG: nightly-mutation-base
      ISSUE_TITLE: Nightly mutation
      ISSUE_LABEL: mutation-nightly
    steps:
      # main at the moment the night starts. fetch-depth 0 brings history and
      # tags, so the base tag and the 7-day fallback resolve locally. The
      # persisted GITHUB_TOKEN is what pushes the tag (contents: write above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # The range is <base tag>...<head>. The tag names the head of the last
      # COMPLETED night. Without it — the first night, or a tag deleted by hand
      # — the base is the one the ledger of unfinished nights was measured
      # against (#943), so a range carried over several nights keeps its base;
      # with no ledger either, the last commit of main older than 7 days: a
      # bounded range, never the whole package. A base that is not an ancestor
      # of main (main rewritten) falls back the same way.
      - name: Resolve the range
        id: range
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base=""
          source=""
          if tagged="$(git rev-parse -q --verify "refs/tags/$BASE_TAG^{commit}")" \
            && git merge-base --is-ancestor "$tagged" "$head"; then
            base="$tagged"
            source="tag \`$BASE_TAG\` (head of the last completed night)"
          elif [ -x scripts/ci/mutation_ledger.sh ] \
            && ledgered="$(scripts/ci/mutation_ledger.sh base)" && [ -n "$ledgered" ] \
            && git merge-base --is-ancestor "$ledgered" "$head"; then
            base="$ledgered"
            source="the \`mutation-ledger\` branch (base of the nights still measuring this range)"
          else
            base="$(git rev-list -1 --before='7 days ago' "$head")"
            source="fallback: last commit of main older than 7 days (no usable \`$BASE_TAG\` tag)"
          fi
          if [ -z "$base" ]; then
            echo "::error::no base commit: no $BASE_TAG tag and no commit of main older than 7 days"
            exit 1
          fi
          {
            echo "head=$head"
            echo "base=$base"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
          echo "range: $base...$head ($source)"

      # Earlier nights' results for this base, restored by mutmut-pr.sh (#943).
      # A ledger for another base is ignored: its results belong to a range
      # this night does not measure.
      - name: Fetch the ledger of earlier nights
        id: ledger
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mutation-ledger.tar.gz"
          if [ -x scripts/ci/mutation_ledger.sh ]; then
            scripts/ci/mutation_ledger.sh fetch "${{ steps.range.outputs.base }}" "$archive"
          else
            echo "mutation_ledger.sh is not on this head; measuring the whole range" >&2
          fi
          if [ -s "$archive" ]; then
            echo "archive=$archive" >> "$GITHUB_OUTPUT"
            echo "state=resumed from the \`mutation-ledger\` branch" >> "$GITHUB_OUTPUT"
          else
            echo "state=none for this base: the range is measured from the start" >> "$GITHUB_OUTPUT"
          fi

      # One wall-clock budget for the whole run (the wrapper's model, spec
      # §6a): a fixed 210 min, whatever the start time. The job runs on a hosted
      # runner, so no morning deadline protects anything here. 210, not 300:
      # on 2026-11-13 and 2026-11-14 the runner was shut down 271 and 276 min
      # into the job, and the last hour before each kill measured about 1000
      # mutants of 19000 (#943). The ledger carries the rest to the next night.
      - name: Budget of 210 min wall clock
        id: budget
        run: |
          set -euo pipefail
          cap=12600
          echo "seconds=$cap" >> "$GITHUB_OUTPUT"
          echo "budget: ${cap}s wall clock, independent of the start time"

      # Three background loops beside mutmut. A ledger checkpoint every 15 min,
      # so a runner shutdown keeps what was measured (#943). A memory and disk
      # sample every 5 min, because the cause of the 2026-11-13/14 shutdowns
      # is not established. And the memory guard (#971): mutmut bounds a
      # mutant's time, not its memory, and on 2026-11-20 mutants that loop and
      # append ran 17 min each until the 16 GiB runner was shut down at
      # 14.5 GiB. The guard stops a mutant process holding 2048 MiB more than
      # mutmut itself, with the signal of mutmut's own timeout, so it is
      # recorded as one. Healthy runs stayed under 3.6 GiB for the whole
      # machine; four children at the allowance stay under 12 GiB. None of
      # the three writes to mutation-raw.log.
      - name: Nightly-scoped mutation testing (no LLM)
        id: mut
        env:
          MUTMUT_PR_TOTAL_BUDGET_SECONDS: ${{ steps.budget.outputs.seconds }}
          MUTMUT_PR_RESUME_ARCHIVE: ${{ steps.ledger.outputs.archive }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set +e
          ( while sleep 300; do echo "== resources $(date -u +%T)"; free -m; df -h / "$PWD"; done ) &
          sampler=$!
          guard=""
          if [ -x scripts/ci/mutant_memory_guard.py ]; then
            .venv/bin/python scripts/ci/mutant_memory_guard.py --allowance-mb 2048 &
            guard=$!
          else
            echo "::warning::mutant_memory_guard.py is not on this head; mutant memory is unbounded tonight (#971)"
          fi
          checkpoints=""
          if [ -x scripts/ci/mutation_ledger.sh ]; then
            scripts/ci/mutation_ledger.sh loop "$BASE" "$HEAD" 900 &
            checkpoints=$!
          fi
          scripts/mutmut-pr.sh "$BASE" 2>&1 | tee mutation-raw.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          kill "$sampler" $guard $checkpoints 2>/dev/null
          wait "$sampler" $guard $checkpoints 2>/dev/null
          if [ -x scripts/ci/mutation_ledger.sh ]; then
            scripts/ci/mutation_ledger.sh save "$BASE" "$HEAD" \
              || echo "::warning::the final ledger checkpoint failed; the next night resumes from the last one"
          fi

      # The same harvest the PR mutation job ran, while the shadow tree is
      # still on disk (#119, #776).
      - name: Collect survivors, with what each one changed
        if: always() && steps.mut.outcome != 'skipped'
        run: |
          uv run mutmut results > mutation-results.txt 2>/dev/null || true
          sed -n 's/^    \(.*\): survived$/\1/p' mutation-results.txt > survivors.txt
          uv run python scripts/ci/mutation_survivors.py \
            --survivors-file survivors.txt \
            --out survivors.jsonl || cp survivors.txt survivors.jsonl
          for bucket in timeout suspicious; do
            sed -n "s/^    \(.*\): ${bucket}\$/\1/p" mutation-results.txt > "${bucket}.txt"
            uv run python scripts/ci/mutation_survivors.py \
              --survivors-file "${bucket}.txt" \
              --out "${bucket}.jsonl" || cp "${bucket}.txt" "${bucket}.jsonl"
          done

      - name: Build mutation-result.json
        if: always() && steps.mut.outcome != 'skipped'
        run: |
          python scripts/ci/mutation_to_json.py \
            --commit "${{ steps.range.outputs.head }}" \
            --raw mutation-raw.log \
            --survivors-file survivors.jsonl \
            --timeouts-file timeout.jsonl \
            --suspicious-file suspicious.jsonl \
            --tool-exit-code "${{ steps.mut.outputs.exit_code || '3' }}" \
            --out mutation-result.json

      # Every measured mutant with its verdict, the kind of change it makes and
      # its time, read while the shadow tree is still on disk (#984). The
      # result above names survivors only, with no kind and no time, and a
      # killed mutant not at all. Two files join the artifact and the sums go
      # to the job summary. This step gives no verdict and cannot fail the
      # night. The `[ -x ]` guard is the repo rule for new scripts/ci calls (#381).
      - name: Record every mutant with its verdict, kind and time
        if: always() && steps.mut.outcome != 'skipped'
        run: |
          if [ -x scripts/ci/mutation_night.py ]; then
            uv run python scripts/ci/mutation_night.py \
              --commit "${{ steps.range.outputs.head }}" \
              --result mutation-result.json \
              --out-night mutation-night.json \
              --out-mutants mutation-mutants.jsonl.gz \
              --summary mutation-night.md \
              || echo "::warning::mutation_night.py failed; the artifact has no per-mutant record tonight (#984)"
            if [ -f mutation-night.md ]; then
              cat mutation-night.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::scripts/ci/mutation_night.py is not on this head; no per-mutant record tonight (#984)"
          fi

      - name: Upload mutation artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-mutation-result-${{ steps.range.outputs.head || github.sha }}
          path: |
            mutation-result.json
            mutation-raw.log
            mutation-night.json
            mutation-mutants.jsonl.gz
          if-no-files-found: ignore

      # Always yields a verdict: a missing result is `tool_failure`, never clean.
      # The `[ -x ]` guard is the repo rule for new scripts/ci calls (#381).
      - name: Verdict
        id: verdict
        if: always()
        run: |
          if [ -x scripts/ci/nightly_mutation_verdict.py ]; then
            python3 scripts/ci/nightly_mutation_verdict.py mutation-result.json >> "$GITHUB_OUTPUT"
          else
            echo "nightly_mutation_verdict.py is not on this head; reporting tool_failure" >&2
            printf 'verdict=tool_failure\ncomplete=false\nreason=verdict script missing\n' >> "$GITHUB_OUTPUT"
          fi

      # Only a COMPLETED night (clean or survivors: every mutant in the range
      # measured) moves the tag. Partial, budget-exceeded and failed nights
      # leave it, so the next night measures the same range again.
      - name: Move the base tag to the measured head
        id: tag
        if: steps.verdict.outputs.complete == 'true'
        run: |
          git tag -f "$BASE_TAG" "${{ steps.range.outputs.head }}"
          if [ -x scripts/ci/push_with_retry.sh ]; then
            scripts/ci/push_with_retry.sh origin "+refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
          else
            git push origin "+refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
          fi

      # The range is measured: its results are history now, and a ledger left
      # behind would be restored against the next range's base by nobody, but
      # would still be fetched and logged every night.
      - name: Drop the ledger of the completed range
        if: steps.tag.outcome == 'success'
        run: |
          if [ -x scripts/ci/mutation_ledger.sh ]; then
            scripts/ci/mutation_ledger.sh drop
          fi

      # What must outlive the artifact goes to the `mutation-reports` branch
      # (#984): the register of mutants left alive over all nights, one history
      # line for this night whatever its verdict, and the night's report in
      # full. The register changes only on a completed night, the rule the tag
      # follows. The step also writes the two texts the report step below puts
      # on the issue. It cannot fail the night: without it the night is still
      # in the artifact. The `[ -x ]` guard is the repo rule (#381).
      - name: Keep the night on the mutation-reports branch
        if: always() && steps.verdict.outcome == 'success'
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          COMPLETE: ${{ steps.verdict.outputs.complete }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -x scripts/ci/mutation_reports.sh ]; then
            scripts/ci/mutation_reports.sh publish "$RUNNER_TEMP/mutation-reports" \
              --result mutation-result.json \
              --night mutation-night.json \
              --mutants mutation-mutants.jsonl.gz \
              --date "$(TZ=Europe/Oslo date '+%F')" \
              --run-id "$GITHUB_RUN_ID" \
              --run-url "$RUN_URL" \
              --base "${BASE:-unknown}" \
              --head "${HEAD:-$GITHUB_SHA}" \
              --verdict "$VERDICT" \
              --complete "${COMPLETE:-false}" \
              --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::the night was not written to the mutation-reports branch; it is in the artifact only (#984)"
          else
            echo "::warning::scripts/ci/mutation_reports.sh is not on this head; the night is in the artifact only (#984)"
          fi

      # One rolling issue. Its body is rewritten every night and holds the
      # state as it stands: this night's verdict and the register over all
      # nights. Each night also gets one comment, so the nights can be read in
      # order and GitHub mails them (owner decision 2026-11-21, #984): an edit
      # mails nobody, which is how the survivors of 2026-11-20 left the issue
      # unseen the night after.
      - name: Report — rewrite the Nightly mutation issue
        if: always() && steps.verdict.outcome == 'success'
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          REASON: ${{ steps.verdict.outputs.reason }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          SOURCE: ${{ steps.range.outputs.source }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          LEDGER: ${{ steps.ledger.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/nightly-report.md"
          case "$TAG_OUTCOME" in
            success) tag_line="moved to \`${HEAD:-unknown}\`" ;;
            failure) tag_line="NOT moved: the push failed (see the run); the next night measures this range again" ;;
            *) tag_line="not moved: verdict \`$VERDICT\` did not measure the whole range; the next night measures it again" ;;
          esac
          {
            echo "<!-- lovspor-nightly-mutation -->"
            echo "## Nightly mutation — $(TZ=Europe/Oslo date '+%F')"
            echo ""
            echo "- Verdict: **$VERDICT** (gate reason: \`$REASON\`)"
            echo "- Range: \`${BASE:-unknown}...${HEAD:-unknown}\` — base from $SOURCE"
            echo "- Base tag \`$BASE_TAG\`: $tag_line"
            echo "- Ledger: ${LEDGER:-unknown}. Counts below include the killed, survived and timeout results it carried."
            echo "- Run: $RUN_URL"
            echo ""
            if [ "$VERDICT" = "partial" ] || [ "$VERDICT" = "budget_exceeded" ]; then
              echo "**Partial: not every mutant in the range was measured. This is not a clean night.**"
              echo "What was measured is saved to the \`mutation-ledger\` branch; the next night measures only the rest."
              echo ""
            fi
            if [ -f mutation-result.json ]; then
              python3 scripts/ci/mutation_gate.py --summary mutation-result.json \
                || echo "(the job summary could not be rendered from mutation-result.json)"
            else
              echo "No mutation-result.json was produced: the run failed before the gate could read it."
            fi
            echo ""
            echo "Mutation is a nightly report, not a merge gate (docs/agentic-ci.md). Survivors are"
            echo "killed by a test, or, when provably equivalent, marked \`# pragma: no mutate\` with a"
            echo "one-line reason or registered in \`mutation-equivalents/\`. Never a \`src/\` rewrite."
            if [ -f "$RUNNER_TEMP/mutation-reports/issue-section.md" ]; then
              echo ""
              cat "$RUNNER_TEMP/mutation-reports/issue-section.md"
            fi
          } > "$body"
          gh label create "$ISSUE_LABEL" --color BFD4F2 \
            --description "Rolling nightly mutation report" --force
          number="$(gh issue list --state open --label "$ISSUE_LABEL" --limit 50 --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
            echo "updated issue #$number"
          else
            number="$(gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$body")"
            echo "created $number"
          fi
          if [ -f "$RUNNER_TEMP/mutation-reports/comment.md" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/mutation-reports/comment.md" \
              || echo "::warning::the night's comment was not posted (#984)"
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      # Last, after the report has been written (#879). Every step above
      # swallows its failure so the report always runs; without this one a
      # partial, budget-exceeded or failed night ended green, and an issue edit
      # sends no mail. `survivors` stays green: a completed measurement is a
      # report, not a gate.
      - name: Fail a night that did not measure its range
        if: always() && steps.verdict.outputs.complete != 'true'
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "::error::nightly mutation verdict '${VERDICT:-none}' (gate reason: ${REASON:-none}): the range was not fully measured and the base tag did not move"
          exit 1

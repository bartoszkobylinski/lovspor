name: Publish determinism

# ADR-0013 validation: a fixture corpus builds to a byte-identical output tree
# "twice, and across machines". Twice is pinned by the unit suite
# (test_publish_emit.py). Across machines needs more than one machine, so each
# leg below builds the same fixture with the real emitter and publishes one
# digest of the tree; the compare job fails when any two legs disagree and
# prints the files that differ. GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build the fixture site and digest it
        run: >-
          uv run python scripts/ci/publish_tree_digest.py
          --work "${{ runner.temp }}/publish-fixture"
          --out "${{ runner.temp }}/digest/${{ matrix.os }}-py${{ matrix.python-version }}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-digest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/digest
          retention-days: 7

  compare:
    needs: digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Download every digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publish-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Every machine built the same tree
        run: uv run python scripts/ci/publish_tree_digest.py --compare "${{ runner.temp }}"/digests/*/

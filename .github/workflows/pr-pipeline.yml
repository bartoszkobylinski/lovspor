# Agentic CI: fast checks -> independent Codex test author -> mutation gate.
# Architecture and invariants: docs/agentic-ci.md
name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A stale run must never outlive a new SHA.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: No committed conflict markers
        # docs/architecture.md carried an unresolved merge block on main for a week
        # (issue #196); nothing read it and nothing checked it.
        run: |
          if git grep -nE '^(<{7}|>{7}) ' -- .; then
            echo '::error::unresolved merge-conflict markers are committed'
            exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy strict
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/

  # The agent lane runs on two machines on purpose. `codex-author` stays on the
  # small self-hosted box because the Codex session's `auth.json` is a long-lived
  # ChatGPT credential that cannot be handed to a hosted runner. Everything
  # downstream of the agent — the full unit suite, the lint, the convergence
  # verdict, the push — runs hosted. Both legs used to share the box (1 shared
  # core, 2 GB, no swap): it died twice in one afternoon under a single job, the
  # second death 28 minutes into `Run tests on Codex additions` (issue #272).
  # Holding the agent session is what that box is for; running the suite is not.
  codex-author:
    # Serialization is the single `codex`-labelled runner's job queue, which is a
    # real FIFO. A shared concurrency group is not: GitHub holds ONE pending entry
    # per group, so a second PR's job evicted the first before it ever got a
    # runner — a red required check with zero steps, no artifact, no comment,
    # no label, because every reporting step is downstream of one that never ran
    # (issue #139).
    runs-on: [self-hosted, linux, codex]
    # A stuck agent job must not hold the lane indefinitely: the box lock alone
    # waits 20 minutes before giving up, and GitHub's default kill is 6 h (#101).
    timeout-minutes: 60
    # The runner holding Codex auth never executes fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # No push token and no write scopes on this lane: the box produces a
    # patch, the hosted verifier is the only leg that can reach the branch.
    permissions:
      contents: read
    env:
      CODEX_PRIMARY_HOME: ${{ vars.CODEX_PRIMARY_HOME }}
      CODEX_SECONDARY_HOME: ${{ vars.CODEX_SECONDARY_HOME }}
      UV_PYTHON: "3.12"
    outputs:
      skip: ${{ steps.antiloop.outputs.skip }}
      author: ${{ steps.author.outputs.author }}
      before_sha: ${{ steps.base.outputs.before_sha }}
      patch: ${{ steps.patch.outputs.patch }}
    steps:
      # Head branch (not merge ref). No credentials persist on this lane: it
      # writes a patch, it does not push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Anti-loop: never regenerate tests for an agent-authored HEAD.
      - name: Anti-loop check
        id: antiloop
        run: |
          # Subject line only, anchored: scanning the whole message meant a
          # commit that merely wrote about the marker silently disabled the test
          # author while the job still reported success.
          if git log -1 --pretty=%s | grep -qE '\[agent:(codex|claude)-(tests|mutation)\]$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record base SHA
        id: base
        if: steps.antiloop.outputs.skip != 'true'
        # An output as well as an env var: every scope and diff check on the
        # verifier is anchored to this SHA, and that runs on another machine.
        run: |
          sha="$(git rev-parse HEAD)"
          echo "BEFORE_SHA=$sha" >> "$GITHUB_ENV"
          echo "before_sha=$sha" >> "$GITHUB_OUTPUT"

      # The agent still needs an environment: it runs the tests it just wrote,
      # by path (.github/codex/pr-tests.md). It must NOT run the whole suite
      # here — that is the verifier's job, on a machine sized for it.
      - name: Sync dependencies
        if: steps.antiloop.outputs.skip != 'true'
        run: uv sync --frozen

      - name: Sample memory while the agent runs
        id: sampler
        if: steps.antiloop.outputs.skip != 'true'
        # Issue #272 could not say which process held 1.7 GB of this box's 2 GB
        # when it died: nothing was sampling, a container sees no host dmesg,
        # and the shell stopped answering before `ps` could run. This makes the
        # next incident attributable instead of inferred. `timeout` bounds the
        # loop because this runner does not force-kill process trees on
        # cancellation (runbook: `Force kill process on cancellation: 'False'`),
        # so an unbounded background loop would outlive the job.
        run: |
          nohup timeout 3300 bash -c '
            while :; do
              {
                date -u +%FT%TZ
                free -m | sed -n 2p
                ps -eo rss,comm --sort=-rss | head -6
              } >> "$RUNNER_TEMP/agent-rss.log"
              sleep 10
            done' >/dev/null 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Codex — independent PR test author
        id: author
        if: steps.antiloop.outputs.skip != 'true'
        # The ceiling belongs on the STEP, not only on the job: a job-level
        # timeout CANCELS the job, and a cancelled job skips the escalation
        # steps that would say why it died. On the step, the same hang fails
        # the step and the reporting below still runs (issue #157, seen on
        # the remediation side when the Codex CLI hung for ~50 minutes).
        timeout-minutes: 45
        env:
          CLAUDE_TESTS_OAUTH_TOKEN: ${{ secrets.CLAUDE_TESTS_OAUTH_TOKEN }}
          CLAUDE_TESTS_MODEL: ${{ vars.CLAUDE_TESTS_MODEL }}
        run: |
          # Serialize with every other agent job on the shared runner box. One
          # unserialized agent run exhausted its 2 GB on 2026-08-18, killed
          # tailscaled and all seven runner agents, and took five unrelated
          # repositories' CI down until the container was rebooted. The fd stays
          # open for the life of this step, so the lock releases even if the job
          # is cancelled.
          exec 9>/home/runner/.mikrus-agent.lock
          flock -w 1200 9 || { echo "another agent job held the box lock for 20 minutes" >&2; exit 1; }
          : "${CODEX_PRIMARY_HOME:?Set repository variable CODEX_PRIMARY_HOME}"
          : "${CODEX_SECONDARY_HOME:?Set repository variable CODEX_SECONDARY_HOME}"
          set +e
          python3 scripts/ci/codex_account_failover.py \
            --primary-home "$CODEX_PRIMARY_HOME" \
            --secondary-home "$CODEX_SECONDARY_HOME" \
            --threshold 95 \
            -- codex exec \
              --sandbox workspace-write \
              "$(cat .github/codex/pr-tests.md)"
          status=$?
          set -e
          # 75 = every Codex account rate-limited (EX_TEMPFAIL, and only that
          # case): a separate non-Fable Claude writes the tests instead of the
          # whole pipeline blocking until a limit window resets. Any other
          # failure stays fatal. The scope guard below applies to both authors.
          if [ "$status" -eq 75 ]; then
            scripts/ci/claude_test_author.sh .github/codex/pr-tests.md
            echo "author=claude" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "author=codex" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop the memory sampler
        if: always() && steps.sampler.outputs.pid != ''
        run: kill "${{ steps.sampler.outputs.pid }}" 2>/dev/null || true

      - name: Upload the memory sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-rss-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-rss.log
          if-no-files-found: ignore

      # Mechanical guard after every Codex run. The prompt is not a boundary.
      # It runs on both lanes: failing on the machine that produced the violation
      # keeps a scope break out of the patch entirely.
      - name: Scope guard
        if: steps.antiloop.outputs.skip != 'true'
        run: scripts/ci/assert_codex_scope.sh "$BEFORE_SHA"

      - name: Hand the agent's work to the verifier
        id: patch
        if: steps.antiloop.outputs.skip != 'true'
        run: |
          # Diff the INDEX against BEFORE_SHA, not the worktree: the agent
          # sometimes commits its own work (which is why the push step on the
          # verifier squashes with `git reset --soft`), and `git add -A` stages
          # whatever it left untracked. Comparing the index to the base tree
          # gives the same patch either way.
          git add -A
          git diff --cached --binary "$BEFORE_SHA" > "$RUNNER_TEMP/agent-tests.patch"
          if [ -s "$RUNNER_TEMP/agent-tests.patch" ]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the agent's tests
        if: steps.patch.outputs.patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-tests.patch

      # #95 and #160: the agent's work must survive the lane failing, or a round
      # is discarded with nothing to read. On this lane the patch handoff may
      # never have run, so preserve independently of it.
      - name: Preserve agent work when the author lane fails
        if: failure()
        run: |
          git add -N tests/
          git diff "${BEFORE_SHA:-HEAD}" -- tests/ > "$RUNNER_TEMP/agent-work.patch" || true

      - name: Upload preserved agent work
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-work-author-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-work.patch
          if-no-files-found: ignore

  # The verdict lane. It runs the suite, so it keeps the name every escalation,
  # every doc and every downstream job already uses. Hosted for two reasons:
  # lovspor is public, so hosted minutes are free and its 4 cores / 16 GB cost
  # nothing — and a lane that does not share a machine with the agent survives
  # the failure mode it has to report (issue #193).
  codex-tests:
    needs: [codex-author]
    # `!cancelled()` rather than `success()`: when the agent lane dies with its
    # box this job must still run, because it is the escalation path for exactly
    # that. A fork PR skips `codex-author`, and a skipped need is not a failure.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      UV_PYTHON: "3.12"
      # The authoring lane's HEAD. Every scope check, diff and squash below is
      # anchored to it, and it was recorded on another machine.
      BEFORE_SHA: ${{ needs.codex-author.outputs.before_sha }}
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      # Head branch (not merge ref), with a token that can push and retrigger CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.LOVSPOR_CI_PUSH_TOKEN }}

      - name: The author lane did not finish
        # Checked after the checkout, because the escalation steps at the end of
        # this job need the helper scripts in the tree. A green check here would
        # claim independent tests ran, which is precisely what did not happen.
        if: needs.codex-author.result != 'success'
        run: |
          echo "::error::codex-author finished as '${{ needs.codex-author.result }}'"
          exit 1

      - name: Install uv
        if: needs.codex-author.outputs.skip != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        if: needs.codex-author.outputs.skip != 'true'
        run: uv sync --frozen

      - name: Download the agent's tests
        if: needs.codex-author.outputs.patch == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      - name: Apply the agent's tests
        if: needs.codex-author.outputs.patch == 'true'
        # --index so the scope guard below sees staged files exactly as it saw
        # them on the authoring box, and so an unapplyable patch fails loudly
        # here instead of silently running the pre-existing suite and calling
        # that an independent round.
        run: git apply --index --whitespace=nowarn "$RUNNER_TEMP/agent-tests.patch"

      - name: Scope guard
        if: needs.codex-author.outputs.skip != 'true'
        run: scripts/ci/assert_codex_scope.sh "$BEFORE_SHA"

      # Codex output is not always ruff-clean (issue #66): normalize before the
      # pipeline's own lint gate sees it, and hard-fail on unfixable lint.
      - name: Normalize and lint Codex output
        if: needs.codex-author.outputs.skip != 'true'
        run: |
          uv run ruff format tests/
          uv run ruff check --fix tests/

      # The log lives in RUNNER_TEMP, never the workspace: the push step squashes
      # with `git add -A`, so a workspace file WILL end up committed to the
      # branch (issue #98).
      - name: Run tests on Codex additions
        id: codex-pytest
        if: needs.codex-author.outputs.skip != 'true'
        # Never fails on its own: a red suite here is evidence, not a verdict.
        # The convergence step below decides whether the failures block (#248).
        run: |
          set +e
          uv run pytest tests/unit/ --junitxml="$RUNNER_TEMP/codex-junit.xml" 2>&1 \
            | tee "$RUNNER_TEMP/codex-pytest.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Issue #248: the author has no notion of diminishing returns, so this
      # step supplies one. A pre-existing test broken by the PR always blocks.
      # An author test the author itself marked `codex_proposal` is advisory.
      # After CODEX_BLOCKING_CAP blocking rounds on one PR, every new author
      # failure is advisory. Advisory tests are committed as xfail(strict=True):
      # visible, tracked, and a hard failure the day the proposal is implemented.
      # Round count comes from the sticky comment — a blocking round pushes no
      # commit, so the comment is the only durable record.
      - name: Convergence verdict
        id: verdict
        if: needs.codex-author.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_BLOCKING_CAP: ${{ vars.CODEX_BLOCKING_CAP || '3' }}
          # A collection error or crash exits non-zero with no failing testcase
          # in the junit. "No failures parsed" is not "everything passed".
          PYTEST_STATUS: ${{ steps.codex-pytest.outputs.status || '1' }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- lovspor-sticky:pipeline -->")) | .body] | join("\n")' \
            > "$RUNNER_TEMP/sticky-pipeline.md" || : > "$RUNNER_TEMP/sticky-pipeline.md"
          uv run python scripts/ci/codex_convergence.py \
            --before-sha "$BEFORE_SHA" \
            --junit "$RUNNER_TEMP/codex-junit.xml" \
            --pytest-status "$PYTEST_STATUS" \
            --sticky-body "$RUNNER_TEMP/sticky-pipeline.md" \
            --cap "$CODEX_BLOCKING_CAP" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --verdict "$RUNNER_TEMP/verdict.json" \
            --comment "$RUNNER_TEMP/escalation.md" \
            --apply
          blocks=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["blocks"]).lower())' "$RUNNER_TEMP/verdict.json")
          advisory=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["advisory"]))' "$RUNNER_TEMP/verdict.json")
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "advisory=$advisory" >> "$GITHUB_OUTPUT"
          if [ "$blocks" = "true" ]; then
            echo "codex-tests BLOCKED — see the verdict" >&2
            exit 1
          fi
          # Advisory tests were just marked xfail in place; prove the tree is green
          # before it is committed, and normalize the one line the marker added.
          if [ "$advisory" -gt 0 ]; then
            uv run ruff format tests/
            uv run pytest tests/unit/ -q
          fi

      # Contract (docs/agentic-ci.md, Failure escalation): a Codex test failing
      # against this head must label the PR, comment, and preserve the tests —
      # a bare red check buries the evidence in an expiring log (issue #95).
      # git add -N: Codex's new test files are untracked, a plain diff misses them.
      - name: Preserve Codex tests on failure
        if: failure() && steps.verdict.outcome == 'failure'
        run: |
          git add -N tests/
          git diff "$BEFORE_SHA" -- tests/ > "$RUNNER_TEMP/codex-tests.patch"

      - name: Upload Codex tests and log
        if: failure() && steps.verdict.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-tests-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/codex-tests.patch
            ${{ runner.temp }}/codex-pytest.log

      - name: Escalate — Codex test exposed an implementation defect
        if: failure() && steps.verdict.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs-implementation-fix"
          # The verdict already wrote the escalation body, carrying the round
          # number and the exact phrase the round counter reads. Append the
          # evidence pointer — append, never overwrite.
          {
            echo ""
            echo "Tests + log: artifact \`codex-tests-${{ github.event.pull_request.head.sha }}\`"
          } >> "$RUNNER_TEMP/escalation.md"
          scripts/ci/pr_sticky_comment.sh pipeline "${{ github.event.pull_request.number }}" "$RUNNER_TEMP/escalation.md"

      # A round that produced only proposals is green. Say so where the owner
      # reads it. Same sticky marker as the blocked rounds — one per workflow —
      # and the advisory body never contains the counted BLOCKED phrase, so it
      # sits in the history without inflating the round count.
      - name: Report advisory proposals
        if: needs.codex-author.outputs.skip != 'true' && steps.verdict.outputs.advisory != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/pr_sticky_comment.sh pipeline "${{ github.event.pull_request.number }}" "$RUNNER_TEMP/escalation.md"

      - name: Commit and push test additions
        id: push
        if: needs.codex-author.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ] && git diff --quiet "$BEFORE_SHA"..HEAD; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Squash everything since BEFORE_SHA into ONE marker commit — the anti-loop
          # check reads the HEAD message, even if Codex committed on its own without it.
          git reset --soft "$BEFORE_SHA"
          # The committer identity names the author that actually ran, like the
          # marker does. Hardcoding codex-ci attributed the Claude fallback's work
          # to Codex in git blame and `git log --author` — fabricated provenance,
          # caught on a real commit in milamber_assistant.
          author="${{ needs.codex-author.outputs.author || 'codex' }}"
          git config user.name "${author}-ci"
          git config user.email "${author}-ci@users.noreply.github.com"
          git add -A
          # The marker names the ACTUAL author — a Claude-written commit
          # stamped [agent:codex-tests] would be fabricated provenance.
          git commit -m "test: add independent coverage for PR #${{ github.event.pull_request.number }} [agent:${{ needs.codex-author.outputs.author || 'codex' }}-tests]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Issue #160: an unfixable lint in agent output failed the normalize step
      # before the tests ran. The job went red, the PR got nothing, and the
      # author's whole run was discarded. #95 preserved the tests when they
      # FAILED; they must also survive the pipeline itself failing.
      - name: Preserve agent work when the pipeline fails
        if: failure() && steps.verdict.outcome != 'failure'
        run: |
          git add -N tests/
          # Diff against BEFORE_SHA, not the worktree: the agent commits its own
          # work (which is why the push step squashes with `git reset --soft`),
          # and a bare `git diff` would then preserve an empty patch — exactly
          # in the case this step exists for. Caught by the independent author
          # on this PR; the older preserve step from #95 already did it right.
          git diff "$BEFORE_SHA" -- tests/ > "$RUNNER_TEMP/agent-work.patch" || true

      - name: Upload preserved agent work
        if: failure() && steps.verdict.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-work-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-work.patch
          if-no-files-found: ignore

      - name: Escalate — the pipeline failed before the tests ran
        if: failure() && steps.verdict.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs-human:pipeline"
          {
            echo "codex-tests BLOCKED before the tests ran — this is a pipeline"
            echo "failure, not evidence about the implementation."
            echo ""
            echo "Nothing was pushed, and the independent author's work for this"
            echo "round is preserved as artifact \`agent-work-${{ github.event.pull_request.head.sha }}\`."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/pipeline-escalation.md"
          scripts/ci/pr_sticky_comment.sh pipeline "${{ github.event.pull_request.number }}" "$RUNNER_TEMP/pipeline-escalation.md"

  # Issue #193. Both escalations in `codex-tests` are steps of that job, and a
  # step cannot run on a runner that no longer exists — so no in-job condition
  # can report a job that died with its runner. On #192 five steps ran, the
  # self-hosted box went offline mid-Codex-step, and the PR ended red with no
  # label and no comment. This reporter runs on a hosted runner so it cannot
  # share the failure mode it exists to report.
  codex-tests-report:
    # Both lanes: `codex-author` is the one that dies with the box, and
    # `codex-tests` can still fail before it reaches its own escalation.
    needs: [codex-author, codex-tests]
    # `always()` would fire on a concurrency cancellation as well, and a run
    # cancelled by the next push is not a blocked PR. `!cancelled()` still runs
    # after a failed dependency, without claiming a cancelled one. A skipped
    # lane (fork PRs) is not a failure either, and `== 'failure'` excludes it.
    if: ${{ !cancelled() && (needs.codex-tests.result == 'failure' || needs.codex-author.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The PR head, not the default branch: this job reports on a `pull_request`
      # run, so it holds no elevated context the head could abuse, and
      # `codex-tests` already executes that same head. Off the default branch, a
      # PR that *introduces* the helper would have none to call here and the
      # reporter would die on a missing file — the silent BLOCKED of issue #193.
      - name: Check out the escalation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Report a codex-tests job that never reached its own escalation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BLOCKED_LABELS: "needs-implementation-fix needs-human:mutation needs-human:pipeline"
        run: |
          set -euo pipefail
          # The in-job escalation runs before `codex-tests` completes, so its
          # label is already visible here. Two labels and two comments for one
          # failure trains a reader to ignore both.
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          for label in $BLOCKED_LABELS; do
            if printf '%s\n' "$current" | grep -Fxq "$label"; then
              echo "already reported: $label"
              exit 0
            fi
          done
          gh pr edit "$PR" --add-label "needs-human:pipeline"
          {
            echo "codex-tests BLOCKED and reported nothing itself — the job ended"
            echo "without reaching its own escalation steps, which is what happens"
            echo "when the agent lane's runner goes away mid-job."
            echo ""
            echo "This is a pipeline failure, not evidence about the implementation."
            echo "Check the runner before re-reading the diff:"
            echo "\`gh api repos/${{ github.repository }}/actions/runners\`"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/lane-escalation.md"
          scripts/ci/pr_sticky_comment.sh pipeline "$PR" "$RUNNER_TEMP/lane-escalation.md"

  mutation:
    # Runs only when fast CI is green, Codex finished, and Codex did NOT just push —
    # a push fires a fresh synchronize run that redoes mutation on the new SHA.
    needs: [fast-ci, codex-tests]
    if: >-
      always() &&
      needs.fast-ci.result == 'success' &&
      needs.codex-tests.result == 'success' &&
      needs.codex-tests.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    # Backstop over the script's own per-file budget (issue #102). Two files
    # can consume 40 minutes of mutation time, and harvesting the resulting
    # cache also needs room to emit the explicit budget verdict artifact.
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    steps:
      # Pin the exact head SHA so mutation-result.json is bound to it (the default
      # pull_request checkout is the merge ref — the wrong SHA for the contract).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: PR-scoped mutation testing (no LLM)
        id: mut
        run: |
          set +e
          scripts/mutmut-pr.sh "${{ github.event.pull_request.base.sha }}" 2>&1 | tee mutation-raw.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Collect survivors, with what each one changed
        if: always()
        run: |
          uv run mutmut results > mutation-results.txt 2>/dev/null || true
          sed -n 's/^    \(.*\): survived$/\1/p' mutation-results.txt > survivors.txt
          # The shadow tree is still on disk here — this is the only moment the
          # mutation diff can be recovered without a second mutmut run (#119).
          # If it fails, the bare ids remain valid input for the report.
          uv run python scripts/ci/mutation_survivors.py \
            --survivors-file survivors.txt \
            --out survivors.jsonl || cp survivors.txt survivors.jsonl

      - name: Build mutation-result.json
        if: always()
        run: |
          python scripts/ci/mutation_to_json.py \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --raw mutation-raw.log \
            --survivors-file survivors.jsonl \
            --tool-exit-code "${{ steps.mut.outputs.exit_code || '3' }}" \
            --out mutation-result.json

      - name: Upload mutation artifact (PASS and FAIL)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-result-${{ github.event.pull_request.head.sha }}
          path: |
            mutation-result.json
            mutation-raw.log

      - name: Job summary
        if: always()
        run: python scripts/ci/mutation_gate.py --summary mutation-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Mutation gate
        run: python scripts/ci/mutation_gate.py mutation-result.json

  # Issue #191. The pipeline's verdict is durable only in the labels: checks
  # scroll off a PR, labels sit on it and on every filtered list. Six
  # `--add-label` calls existed across the two workflows and no `--remove-label`
  # anywhere, so a PR that was blocked, fixed and re-run green kept asserting a
  # defect that had been resolved rounds earlier. The error runs in the
  # expensive direction — a genuinely blocked PR then looks like a resolved one.
  ready:
    needs: [fast-ci, codex-tests, mutation]
    # READY is a claim about the mutation gate, so it is not made when that job
    # was skipped. That is the run where the test author pushed and a fresh run
    # is already on its way to reach its own verdict.
    if: needs.mutation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Retract the blocked labels this run disproved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Read by tests/unit/test_agentic_ci_workflows.py, which compares this
          # list against every `--add-label` in both workflows: a new blocked
          # label with no retraction here is a failing test, not a silent
          # regression.
          BLOCKED_LABELS: "needs-implementation-fix needs-human:mutation needs-human:pipeline"
        run: |
          set -euo pipefail
          # Ask before removing. `--remove-label` on a label the PR does not
          # carry is an API call that can fail the job at the one moment the
          # pipeline is trying to report that everything passed.
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          for label in $BLOCKED_LABELS; do
            if printf '%s\n' "$current" | grep -Fxq "$label"; then
              gh pr edit "$PR" --remove-label "$label"
              echo "retracted $label"
            fi
          done
          echo "READY TO MERGE"

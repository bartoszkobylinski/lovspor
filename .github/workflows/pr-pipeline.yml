# Agentic CI: fast checks -> independent Codex test author -> mutation gate.
# Architecture and invariants: docs/agentic-ci.md
name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A stale run must never outlive a new SHA.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy strict
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/

  codex-tests:
    runs-on: [self-hosted, linux, codex]
    concurrency:
      group: lovspor-codex-subscription
      cancel-in-progress: false
    # The runner holding Codex auth never executes fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CODEX_PRIMARY_HOME: ${{ vars.CODEX_PRIMARY_HOME }}
      CODEX_SECONDARY_HOME: ${{ vars.CODEX_SECONDARY_HOME }}
      UV_PYTHON: "3.12"
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      # Head branch (not merge ref), with a token that can push and retrigger CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.LOVSPOR_CI_PUSH_TOKEN }}

      # Anti-loop: never regenerate tests for an agent-authored HEAD.
      - name: Anti-loop check
        id: antiloop
        run: |
          # Subject line only, anchored: scanning the whole message meant a
          # commit that merely wrote about the marker silently disabled the test
          # author while the job still reported success.
          if git log -1 --pretty=%s | grep -qE '\[agent:(codex|claude)-(tests|mutation)\]$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record base SHA
        if: steps.antiloop.outputs.skip != 'true'
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Sync dependencies
        if: steps.antiloop.outputs.skip != 'true'
        run: uv sync --frozen

      - name: Codex — independent PR test author
        id: author
        if: steps.antiloop.outputs.skip != 'true'
        env:
          CLAUDE_TESTS_OAUTH_TOKEN: ${{ secrets.CLAUDE_TESTS_OAUTH_TOKEN }}
          CLAUDE_TESTS_MODEL: ${{ vars.CLAUDE_TESTS_MODEL }}
        run: |
          # Serialize with every other agent job on the shared runner box. One
          # unserialized agent run exhausted its 2 GB on 2026-08-18, killed
          # tailscaled and all seven runner agents, and took five unrelated
          # repositories' CI down until the container was rebooted. The fd stays
          # open for the life of this step, so the lock releases even if the job
          # is cancelled.
          exec 9>/home/runner/.mikrus-agent.lock
          flock -w 1200 9 || { echo "another agent job held the box lock for 20 minutes" >&2; exit 1; }
          : "${CODEX_PRIMARY_HOME:?Set repository variable CODEX_PRIMARY_HOME}"
          : "${CODEX_SECONDARY_HOME:?Set repository variable CODEX_SECONDARY_HOME}"
          set +e
          python3 scripts/ci/codex_account_failover.py \
            --primary-home "$CODEX_PRIMARY_HOME" \
            --secondary-home "$CODEX_SECONDARY_HOME" \
            --threshold 95 \
            -- codex exec \
              --sandbox workspace-write \
              "$(cat .github/codex/pr-tests.md)"
          status=$?
          set -e
          # 75 = every Codex account rate-limited (EX_TEMPFAIL, and only that
          # case): a separate non-Fable Claude writes the tests instead of the
          # whole pipeline blocking until a limit window resets. Any other
          # failure stays fatal. The scope guard below applies to both authors.
          if [ "$status" -eq 75 ]; then
            scripts/ci/claude_test_author.sh .github/codex/pr-tests.md
            echo "author=claude" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "author=codex" >> "$GITHUB_OUTPUT"
          fi

      # Mechanical guard after every Codex run. The prompt is not a boundary.
      - name: Scope guard
        if: steps.antiloop.outputs.skip != 'true'
        run: scripts/ci/assert_codex_scope.sh "$BEFORE_SHA"

      # Codex output is not always ruff-clean (issue #66): normalize before the
      # pipeline's own lint gate sees it, and hard-fail on unfixable lint.
      - name: Normalize and lint Codex output
        if: steps.antiloop.outputs.skip != 'true'
        run: |
          uv run ruff format tests/
          uv run ruff check --fix tests/

      # The log lives in RUNNER_TEMP, never the workspace: the push step squashes
      # with `git add -A`, and a self-hosted workspace persists between runs — a
      # workspace file WILL end up committed to the branch (issue #98).
      - name: Run tests on Codex additions
        id: codex-pytest
        if: steps.antiloop.outputs.skip != 'true'
        run: |
          set +e
          uv run pytest tests/unit/ 2>&1 | tee "$RUNNER_TEMP/codex-pytest.log"
          exit "${PIPESTATUS[0]}"

      # Contract (docs/agentic-ci.md, Failure escalation): a Codex test failing
      # against this head must label the PR, comment, and preserve the tests —
      # a bare red check buries the evidence in an expiring log (issue #95).
      # git add -N: Codex's new test files are untracked, a plain diff misses them.
      - name: Preserve Codex tests on failure
        if: failure() && steps.codex-pytest.outcome == 'failure'
        run: |
          git add -N tests/
          git diff "$BEFORE_SHA" -- tests/ > "$RUNNER_TEMP/codex-tests.patch"

      - name: Upload Codex tests and log
        if: failure() && steps.codex-pytest.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-tests-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/codex-tests.patch
            ${{ runner.temp }}/codex-pytest.log

      - name: Escalate — Codex test exposed an implementation defect
        if: failure() && steps.codex-pytest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs-implementation-fix"
          {
            echo "codex-tests BLOCKED: Codex-authored tests fail against this head."
            echo ""
            grep -E '^FAILED ' "$RUNNER_TEMP/codex-pytest.log" | head -10
            echo ""
            echo "Tests + log: artifact \`codex-tests-${{ github.event.pull_request.head.sha }}\` (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$RUNNER_TEMP/escalation.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/escalation.md"

      - name: Commit and push test additions
        id: push
        if: steps.antiloop.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ] && git diff --quiet "$BEFORE_SHA"..HEAD; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Squash everything since BEFORE_SHA into ONE marker commit — the anti-loop
          # check reads the HEAD message, even if Codex committed on its own without it.
          git reset --soft "$BEFORE_SHA"
          git config user.name "codex-ci"
          git config user.email "codex-ci@users.noreply.github.com"
          git add -A
          # The marker names the ACTUAL author — a Claude-written commit
          # stamped [agent:codex-tests] would be fabricated provenance.
          git commit -m "test: add independent coverage for PR #${{ github.event.pull_request.number }} [agent:${{ steps.author.outputs.author || 'codex' }}-tests]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  mutation:
    # Runs only when fast CI is green, Codex finished, and Codex did NOT just push —
    # a push fires a fresh synchronize run that redoes mutation on the new SHA.
    needs: [fast-ci, codex-tests]
    if: >-
      always() &&
      needs.fast-ci.result == 'success' &&
      needs.codex-tests.result == 'success' &&
      needs.codex-tests.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    # Backstop over the script's own per-file budget (issue #102). Two files
    # can consume 40 minutes of mutation time, and harvesting the resulting
    # cache also needs room to emit the explicit budget verdict artifact.
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    steps:
      # Pin the exact head SHA so mutation-result.json is bound to it (the default
      # pull_request checkout is the merge ref — the wrong SHA for the contract).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: PR-scoped mutation testing (no LLM)
        id: mut
        run: |
          set +e
          scripts/mutmut-pr.sh "${{ github.event.pull_request.base.sha }}" 2>&1 | tee mutation-raw.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Collect survivors, with what each one changed
        if: always()
        run: |
          uv run mutmut results > mutation-results.txt 2>/dev/null || true
          sed -n 's/^    \(.*\): survived$/\1/p' mutation-results.txt > survivors.txt
          # The shadow tree is still on disk here — this is the only moment the
          # mutation diff can be recovered without a second mutmut run (#119).
          # If it fails, the bare ids remain valid input for the report.
          uv run python scripts/ci/mutation_survivors.py \
            --survivors-file survivors.txt \
            --out survivors.jsonl || cp survivors.txt survivors.jsonl

      - name: Build mutation-result.json
        if: always()
        run: |
          python scripts/ci/mutation_to_json.py \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --raw mutation-raw.log \
            --survivors-file survivors.jsonl \
            --tool-exit-code "${{ steps.mut.outputs.exit_code || '3' }}" \
            --out mutation-result.json

      - name: Upload mutation artifact (PASS and FAIL)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-result-${{ github.event.pull_request.head.sha }}
          path: |
            mutation-result.json
            mutation-raw.log

      - name: Job summary
        if: always()
        run: python scripts/ci/mutation_gate.py --summary mutation-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Mutation gate
        run: python scripts/ci/mutation_gate.py mutation-result.json

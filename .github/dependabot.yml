version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    # mutmut 3.x has open upstream bugs (#480, #485, #486, #490) that
    # break editable installs, dataclass mutants, initial test runs,
    # and dict iteration. We pin to 2.x in pyproject.toml; this rule
    # also stops Dependabot from re-proposing the major bump weekly.
    # Revisit when mutmut 3.x stabilizes — see docs/decisions.md §9.
    ignore:
      - dependency-name: "mutmut"
        update-types: ["version-update:semver-major"]

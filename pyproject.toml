[project]
name = "lovspor"
version = "0.5.1"
description = "Norwegian law change tracker — produces the lovverk corpus from Lovdata public data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Bartosz Kobylinski", email = "bartosz.kobylinski@gmail.com" }]
keywords = ["norwegian-law", "lovdata", "legal-corpus", "nlod", "rag", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
    "python-dotenv>=1.0.1",
    # Floor is a security floor, not a feature floor. <1.27.2 routes an
    # HTTP session by its id alone without checking that the request
    # authenticates as the principal that opened it (CVE-2026-52869), so
    # a leaked or guessed Mcp-Session-Id bypasses the bearer auth this
    # server relies on. 1.28.1 additionally covers CVE-2026-59950.
    # Ceiling: mcp 2.0.0 removed the mcp.server.fastmcp module this server
    # is built on, so an unbounded spec breaks `import lovspor.mcp` on any
    # fresh install (caught in the 0.4.0 clean-wheel smoke). Lift only with
    # a deliberate 2.x migration.
    "mcp>=1.28.1,<2",
    "numpy>=1.26.0",
    # tiktoken is required by the OpenAI embedder for token-aware
    # truncation under the 8191-token API limit. It's tiny (~3 MB
    # wheel) so we don't gain anything by gating it behind an extra.
    "tiktoken>=0.7.0",
    # The hosted MCP transport (Sprint 12) serves the tool surface over
    # Streamable HTTP. mcp already requires starlette + uvicorn, but the
    # HTTP entry point imports starlette directly and runs uvicorn, so we
    # declare both here rather than lean on a transitive pin.
    "starlette>=0.27",
    "uvicorn>=0.31.1",
    # WorkOS AuthKit issues RS256 JWTs for the self-service OAuth connector path
    # (Sprint 12 item 3); we verify them against its JWKS in workos_auth.py. The
    # [crypto] extra pulls cryptography, which PyJWT needs for RS256.
    "pyjwt[crypto]>=2.10.0",
    # anyio.to_thread offloads the blocking JWKS/JWT verification off the event
    # loop. Already a transitive mcp dep; declared because we import it directly.
    "anyio>=4.0.0",
]

[project.optional-dependencies]
# Benchmark-only, and deliberately not a runtime dependency: sentence-transformers
# pulls torch (gigabytes), and nothing under src/lovspor imports either — the
# production embedder talks to the OpenAI API over httpx. Only the two local
# NbAiLab models in benchmarks/embedding_comparison/run.py need it. Declared as an
# extra so `uv sync --extra embeddings` — the command that benchmark's README, its
# module docstring and its ImportError all print — works from a clean clone.
embeddings = ["sentence-transformers>=3.0.0"]

[project.urls]
Homepage = "https://github.com/bartoszkobylinski/lovspor"
Corpus = "https://github.com/bartoszkobylinski/lovverk"
Issues = "https://github.com/bartoszkobylinski/lovspor/issues"

[project.scripts]
lovspor = "lovspor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "mutmut==2.5.1",
    "pre-commit>=4.0.0",
    "lxml-stubs>=0.5.1",
    "hypothesis>=6.115.0",
    # pyyaml is imported by evals/ and tests/ only — never by src/lovspor. It
    # belongs in the dev group now that evals is repo-only tooling rather than
    # a shipped console script; making it a runtime dependency would force it
    # on every `pip install lovspor` for code the wheel no longer contains.
    "pyyaml>=6.0",
    # jsonschema backs LLHB dataset validation (lovspor.llhb.schema). Dev-only
    # like pyyaml: the module lazy-imports it with a clear error, so the wheel
    # gains no runtime dependency for benchmark-only tooling. Stubs follow the
    # lxml-stubs precedent so `mypy src/` stays strict-green.
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `evals` is deliberately NOT here. Shipping it installed a generically-named
# top-level `evals/` package into site-packages, colliding on the import name
# with OpenAI's `evals` distribution: co-install both and one shadows the other.
# It is repo-only tooling regardless — evals/runner.py resolves its scenarios,
# personas, and fixtures relative to the source tree (and --llm-driven looks for
# the repo's pyproject.toml), so the shipped `lovspor-eval` console script could
# never have worked from a `pip install`. It ships in the sdist as source; run it
# from a checkout with `uv run python -m evals.runner`.
packages = ["src/lovspor"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: the sdist ships only package sources, evals, docs, and
# metadata — never dev caches (.uv-cache, .hypothesis) or working notes, which
# hatchling's gitignore-based default would otherwise sweep in (12k+ files,
# including a venv symlink that breaks the wheel build).
include = [
  "/src/lovspor",
  "/evals",
  "/docs",
  "/README.md",
  "/LICENSE",
]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
]
ignore = [
    "PLR0913",  # too many args — we enforce manually via review
    "UP047",    # PEP 695 generic syntax — disabled until mutmut 2.x parser supports it
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts allowed in tests
    "S105",   # hardcoded password fine in tests
    "S106",
    "PLR2004", # magic numbers fine in tests
    "S603",   # subprocess invocation fine in tests (we set up real git repos)
    "S607",   # partial path "git" fine in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: integration tests (slower, may use real fixtures)",
    "network: requires network access",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["src/lovspor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true

# ---------- Mutmut ----------
[tool.mutmut]
paths_to_mutate = "src/lovspor/"
runner = "uv run pytest -x -q tests/unit/"
tests_dir = "tests/unit/"

[project]
name = "lovspor"
version = "0.1.0"
description = "Norwegian law change tracker — produces the lovverk corpus from Lovdata public data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Bartosz Kobylinski", email = "bartosz.kobylinski@gmail.com" }]
keywords = ["norwegian-law", "lovdata", "legal-corpus", "nlod", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    # tiktoken is required by the OpenAI embedder for token-aware
    # truncation under the 8191-token API limit. It's tiny (~3 MB
    # wheel) so we don't gain anything by gating it behind an extra.
    "tiktoken>=0.7.0",
    # pyyaml backs the `lovspor-eval` console script (evals.runner, which
    # is shipped in the wheel). It was only ever present transitively via
    # dev tooling, so `pip install lovspor` shipped a broken entry point.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/bartoszkobylinski/lovspor"
Corpus = "https://github.com/bartoszkobylinski/lovverk"
Issues = "https://github.com/bartoszkobylinski/lovspor/issues"

[project.scripts]
lovspor = "lovspor.cli:app"
lovspor-eval = "evals.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "mutmut==2.5.1",
    "pre-commit>=4.0.0",
    "lxml-stubs>=0.5.1",
    "hypothesis>=6.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lovspor", "evals"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: the sdist ships only package sources, evals, docs, and
# metadata — never dev caches (.uv-cache, .hypothesis) or working notes, which
# hatchling's gitignore-based default would otherwise sweep in (12k+ files,
# including a venv symlink that breaks the wheel build).
include = [
  "/src/lovspor",
  "/evals",
  "/docs",
  "/README.md",
  "/LICENSE",
]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
]
ignore = [
    "PLR0913",  # too many args — we enforce manually via review
    "UP047",    # PEP 695 generic syntax — disabled until mutmut 2.x parser supports it
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts allowed in tests
    "S105",   # hardcoded password fine in tests
    "S106",
    "PLR2004", # magic numbers fine in tests
    "S603",   # subprocess invocation fine in tests (we set up real git repos)
    "S607",   # partial path "git" fine in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: integration tests (slower, may use real fixtures)",
    "network: requires network access",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["src/lovspor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true

# ---------- Mutmut ----------
[tool.mutmut]
paths_to_mutate = "src/lovspor/"
runner = "uv run pytest -x -q tests/unit/"
tests_dir = "tests/unit/"
